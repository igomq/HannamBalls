        function updateHud(now) {
            battle.fighters.forEach((fighter) => {
                sanitizeFighterState(fighter);
                if (!fighter.hudElement) {
                    return;
                }

                const hpRatio = Math.max(0, fighter.hp / fighter.maxHp);
                const skills = getSkills(fighter.definition);
                const cooldowns = ensureSkillCooldowns(fighter);

                if (fighter.lastHpRatio !== hpRatio) {
                    fighter.hudHpFill.style.width = `${hpRatio * 100}%`;
                    fighter.lastHpRatio = hpRatio;
                }

                let hpTextVal = `HP ${Math.ceil(Math.max(0, fighter.hp))} / ${fighter.maxHp}`;
                if (fighter.shield > 0) {
                    hpTextVal += ` (+${Math.round(fighter.shield)})`;
                }
                if (fighter.lastHpText !== hpTextVal) {
                    fighter.hudHpText.textContent = hpTextVal;
                    fighter.lastHpText = hpTextVal;
                }

                const skillReadyKey = skills.map((skill, index) => {
                    const duration = Math.max(0.001, skillCooldownDuration(fighter, index));
                    const remaining = Math.max(0, cooldowns[index] ?? 0);
                    return Math.max(0, 1 - remaining / duration).toFixed(3);
                }).join("|");
                if (fighter.lastSkillReadyKey !== skillReadyKey) {
                    (fighter.hudSkillFills || []).forEach((fill, index) => {
                        const duration = Math.max(0.001, skillCooldownDuration(fighter, index));
                        const remaining = Math.max(0, cooldowns[index] ?? 0);
                        const ready = Math.max(0, 1 - remaining / duration);
                        fill.style.width = `${ready * 100}%`;
                    });
                    fighter.lastSkillReadyKey = skillReadyKey;
                }

                let statusTextVal = "";
                let statusColor = "";
                if (fighter.dead) {
                    statusTextVal = "탈락";
                    statusColor = "#ba1a1a";
                } else if (fighter.gogeonpaUntil > now) {
                    statusTextVal = `고전파 모드 ${((fighter.gogeonpaUntil - now) / 1000).toFixed(1)}초`;
                    statusColor = "#ef4444";
                } else if (fighter.centerLockUntil > now) {
                    statusTextVal = `먹방 ${(Math.max(0, fighter.centerLockUntil - now) / 1000).toFixed(1)}초`;
                    statusColor = fighter.definition.color;
                } else if (fighter.offMapUntil > now) {
                    statusTextVal = `맵 밖 ${(Math.max(0, fighter.offMapUntil - now) / 1000).toFixed(1)}초`;
                    statusColor = fighter.definition.color;
                } else if (isStunned(fighter, now)) {
                    statusTextVal = `행동 불가 ${(Math.max(0, fighter.stunnedUntil - now) / 1000).toFixed(1)}초`;
                    statusColor = "#ba1a1a";
                } else if (fighter.taehoonPoison && fighter.taehoonPoison.expiresAt > now) {
                    statusTextVal = `독 ${(Math.max(0, fighter.taehoonPoison.expiresAt - now) / 1000).toFixed(1)}초`;
                    statusColor = "#7c3aed";
                } else if (fighter.isMapObject && fighter.mapExpireAt > now) {
                    statusTextVal = `잔여 ${(Math.max(0, fighter.mapExpireAt - now) / 1000).toFixed(1)}초`;
                    statusColor = fighter.definition.color;
                } else {
                    statusTextVal = skills.map((skill, index) => {
                        const duration = skillCooldownDuration(fighter, index);
                        const remaining = Math.max(0, cooldowns[index] ?? 0);
                        if (duration >= 900) {
                            return skill.name;
                        }
                        return remaining <= 0
                            ? `CD ${skill.name} READY`
                            : `CD ${skill.name} ${remaining.toFixed(1)} / ${duration.toFixed(1)}초`;
                    }).join(" · ") || "READY";
                }

                if (fighter.lastStatusText !== statusTextVal) {
                    fighter.hudStatus.textContent = statusTextVal;
                    fighter.hudStatus.style.color = statusColor;
                    fighter.lastStatusText = statusTextVal;
                }

                const bonusParts = [];
                if (fighter.statBonusAttack !== 0) {
                    bonusParts.push(`ATK ${fighter.statBonusAttack > 0 ? "+" : ""}${Math.round(fighter.statBonusAttack)}`);
                }
                if (Math.abs(fighter.statBonusSpeedRatio) > 0.005) {
                    bonusParts.push(`SPD ${fighter.statBonusSpeedRatio > 0 ? "+" : ""}${Math.round(fighter.statBonusSpeedRatio * 100)}%`);
                }
                if (fighter.statDamageReduction > 0) {
                    bonusParts.push(`DMG -${Math.round(fighter.statDamageReduction * 100)}%`);
                }
                if (fighter.tempDamageReductionUntil > now) {
                    bonusParts.push(`방어 +${Math.round(fighter.tempDamageReduction * 100)}% ${((fighter.tempDamageReductionUntil - now) / 1000).toFixed(1)}초`);
                }
                if (fighter.slowUntil > now) {
                    bonusParts.push(`둔화 ${Math.round(fighter.slowMultiplier * 100)}% ${((fighter.slowUntil - now) / 1000).toFixed(1)}초`);
                }
                if (fighter.hasteUntil > now) {
                    bonusParts.push(`가속 +${Math.round((fighter.hasteMultiplier - 1) * 100)}% ${((fighter.hasteUntil - now) / 1000).toFixed(1)}초`);
                }
                if (fighter.definition.id === "kim-junmo") {
                    const maxUses = fighter.definition.passive?.effects?.selfOutOnSkillUse || 4;
                    bonusParts.push(`스킬 ${fighter.skillUseCount}/${maxUses}`);
                }
                if (fighter.definition.id === "song-geonuk" && fighter.dietUses > 0) {
                    bonusParts.push(`다이어트 ${fighter.dietUses}회`);
                    const cap = fighter.statDamageReductionCap || fighter.definition.skill.effects.maxDamageReduction || 0;
                    if (cap > 0) {
                        bonusParts.push(`감소 ${Math.round(fighter.statDamageReduction * 100)}% / ${Math.round(cap * 100)}%`);
                    }
                }
                if (fighter.definition.id === "lee-seunghyun") {
                    bonusParts.push(`사용 ${fighter.seunghyunSkillUses}회`);
                }
                if (fighter.definition.id === "bbangki") {
                    bonusParts.push(`각성 ${fighter.bbangkiAwakenUses || 0}회`);
                    if (fighter.bbangkiCrashAt > now) {
                        bonusParts.push(`현타 ${((fighter.bbangkiCrashAt - now) / 1000).toFixed(1)}초`);
                    }
                }
                if (fighter.definition.id === "faker") {
                    bonusParts.push(`불사 ${fighter.fakerPassiveUses || 0}/2`);
                }
                if (fighter.healingBlockedUntil > now) {
                    bonusParts.push(`회복 봉인 ${((fighter.healingBlockedUntil - now) / 1000).toFixed(1)}초`);
                }
                if (fighter.taehoonPoison && fighter.taehoonPoison.expiresAt > now && !String(statusTextVal).startsWith("독")) {
                    bonusParts.push(`독 ${((fighter.taehoonPoison.expiresAt - now) / 1000).toFixed(1)}초`);
                }
                if (fighter.damageMultiplier > 1.001) {
                    const mult = fighter.damageMultiplier;
                    bonusParts.push(Math.abs(mult - 2) < 0.001
                        ? "트로피 피해 x2"
                        : `피해 x${mult.toFixed(2)}`);
                }

                if (bonusParts.length > 0) {
                    const bonusTextVal = bonusParts.join(" / ");
                    if (fighter.lastStatBonusText !== bonusTextVal) {
                        fighter.hudStatBonus.classList.remove("hidden");
                        fighter.hudStatBonus.textContent = bonusTextVal;
                        fighter.lastStatBonusText = bonusTextVal;
                    }
                } else {
                    if (fighter.lastStatBonusText !== "hidden") {
                        fighter.hudStatBonus.classList.add("hidden");
                        fighter.lastStatBonusText = "hidden";
                    }
                }
            });
            updateBossHealthBanner(now);
        }

        function updateBossHealthBanner(now) {
            if (!isBossBattle) {
                bossHealthBanner.classList.add("hidden");
                return;
            }
            const boss = battle.fighters.find((fighter) => fighter.isBoss);
            if (!boss) return;
            bossHealthBanner.classList.remove("hidden");
            const ratio = Math.max(0, Math.min(1, boss.hp / boss.maxHp));
            bossHealthName.textContent = boss.definition.name;
            bossHealthFill.style.width = `${ratio * 100}%`;
            bossHealthText.textContent = boss.dead
                ? "처치 완료"
                : `HP ${Math.ceil(Math.max(0, boss.hp))} / ${boss.maxHp}${boss.shield > 0 ? ` + 보호막 ${Math.round(boss.shield)}` : ""}`;

            const skills = getSkills(boss.definition);
            const cooldowns = ensureSkillCooldowns(boss);
            bossCooldownRows.forEach((row, index) => {
                const skill = skills[index];
                if (!skill) {
                    row.classList.add("hidden");
                    return;
                }
                row.classList.remove("hidden");
                const nameEl = row.querySelector(".boss-cooldown-name");
                const textEl = row.querySelector(".boss-cooldown-text");
                const fillEl = row.querySelector(".boss-cooldown-fill");
                const duration = Math.max(0.001, skillCooldownDuration(boss, index));
                const remaining = Math.max(0, cooldowns[index] ?? 0);
                const progress = Math.max(0, Math.min(1, 1 - remaining / duration));
                if (nameEl) nameEl.textContent = skill.name;
                if (textEl) {
                    textEl.textContent = remaining <= 0
                        ? "READY"
                        : `CD ${remaining.toFixed(1)} / ${duration.toFixed(1)}초`;
                }
                if (fillEl) {
                    fillEl.style.width = `${progress * 100}%`;
                    fillEl.style.backgroundColor = remaining <= 0
                        ? "#4ade80"
                        : (index === 0 ? "#38bdf8" : "#fbbf24");
                }
            });

            const states = [];
            if (boss.definition.id === "faker") {
                states.push(`불사대마왕 ${boss.fakerPassiveUses || 0} / ${boss.definition.passive?.effects?.maxTriggers || 2}`);
            }
            if (boss.definition.id === "roh-moohyun") {
                const micCount = battle.fighters.filter((f) => !f.dead && f.mapObjectKind === "mic").length;
                const piaget = battle.fighters.find((f) => !f.dead && f.mapObjectKind === "piaget");
                states.push(`마이크 ${micCount}`);
                if (piaget) {
                    const remain = Math.max(0, ((piaget.mapExpireAt || 0) - now) / 1000);
                    states.push(`피아제 ${remain.toFixed(1)}초`);
                } else if (battle.nextPiagetAt) {
                    states.push(`다음 피아제 ${Math.max(0, (battle.nextPiagetAt - now) / 1000).toFixed(1)}초`);
                }
            }
            if (boss.healingBlockedUntil > now) states.push(`회복 봉인 ${((boss.healingBlockedUntil - now) / 1000).toFixed(1)}초`);
            if (boss.gogeonpaUntil > now) states.push(`고전파 ${((boss.gogeonpaUntil - now) / 1000).toFixed(1)}초`);
            const raidDmgMult = Number.isFinite(boss.raidIncomingDamageMultiplier) ? boss.raidIncomingDamageMultiplier : 1;
            if (raidDmgMult < 0.995) {
                states.push(`레이드 방어 ${Math.round((1 - raidDmgMult) * 100)}%`);
            } else if (raidDmgMult > 1.005) {
                states.push(`소수 보정 피해 +${Math.round((raidDmgMult - 1) * 100)}%`);
            }
            bossHealthStatus.textContent = states.join(" · ") || boss.definition.passive?.name || "";
        }

        function renderFighters(now) {
            const despawnQueue = [];
            battle.fighters.forEach((fighter) => {
                // 맵 오브젝트·부엉이 등은 죽은 뒤 완전 제거(잔상·HUD 방지)
                if (fighter.dead && shouldDespawnOnDeath(fighter)) {
                    despawnQueue.push(fighter);
                    return;
                }

                if (!fighter.element) {
                    return;
                }

                const stunState = !fighter.dead && isStunned(fighter, now);
                if (fighter.lastIsStunned !== stunState) {
                    fighter.element.classList.toggle("is-stunned", stunState);
                    fighter.lastIsStunned = stunState;
                }

                if (fighter.lastDead !== fighter.dead) {
                    fighter.element.classList.toggle("is-dead", fighter.dead);
                    fighter.lastDead = fighter.dead;
                }

                const offmapState = !fighter.dead && fighter.offMapUntil > now;
                if (fighter.lastIsOffmap !== offmapState) {
                    fighter.element.classList.toggle("is-offmap", offmapState);
                    fighter.lastIsOffmap = offmapState;
                }

                const shieldState = !fighter.dead && fighter.shield > 0;
                if (fighter.lastHasShield !== shieldState) {
                    fighter.element.classList.toggle("has-shield", shieldState);
                    fighter.lastHasShield = shieldState;
                }

                const tasteMarkedState = !fighter.dead && (
                    (fighter.tasteMarks?.size > 0) || (fighter.rohMarks?.size > 0)
                );
                fighter.element.classList.toggle("taste-marked", tasteMarkedState);
                fighter.element.classList.toggle("gogeonpa-mode", !fighter.dead && fighter.gogeonpaUntil > now);

                if (fighter.isMapObject && !fighter.dead) {
                    const hpRatio = Math.max(0, Math.min(1, fighter.hp / Math.max(1, fighter.maxHp)));
                    const fillColor = colorForHpRatio(fighter.definition.color, hpRatio);
                    if (fighter.lastMapHpColor !== fillColor) {
                        fighter.element.style.background = fillColor;
                        fighter.element.style.opacity = String(0.45 + hpRatio * 0.55);
                        fighter.lastMapHpColor = fillColor;
                    }
                }

                const radius = fighterRadius(fighter);
                fighter.element.style.transform = `translate(${fighter.x - radius}px, ${fighter.y - radius}px)`;
            });
            if (despawnQueue.length > 0) {
                despawnQueue.forEach((fighter) => removeFighterCompletely(fighter));
            }
        }

        function effectRing(x, y, size, color) {
            if (activeEffects.rings >= EFFECT_LIMITS.rings) {
                return;
            }

            activeEffects.rings++;
            const ring = document.createElement("div");
            ring.className = "effect-ring";
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            ring.style.width = `${size}px`;
            ring.style.height = `${size}px`;
            ring.style.color = color;
            arena.appendChild(ring);
            setTimeout(() => {
                ring.remove();
                activeEffects.rings--;
            }, 560);
        }

        function screenFlash(color) {
            if (activeEffects.flashes >= EFFECT_LIMITS.flashes) {
                return;
            }

            activeEffects.flashes++;
            const flash = document.createElement("div");
            flash.className = "arena-flash";
            flash.style.color = color;
            arena.appendChild(flash);
            setTimeout(() => {
                flash.remove();
                activeEffects.flashes--;
            }, 240);
        }

        function impactStar(x, y, color) {
            if (activeEffects.stars >= EFFECT_LIMITS.stars) {
                return;
            }

            activeEffects.stars++;
            const star = document.createElement("div");
            star.className = "impact-star";
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            star.style.color = color;
            arena.appendChild(star);
            setTimeout(() => {
                star.remove();
                activeEffects.stars--;
            }, 560);
        }

        function burst(x, y, color, count = 8) {
            const allowed = Math.max(0, Math.min(count, EFFECT_LIMITS.bursts - activeEffects.bursts, 8));

            for (let index = 0; index < allowed; index += 1) {
                activeEffects.bursts++;
                const shard = document.createElement("div");
                const angle = (Math.PI * 2 * index) / allowed;
                const distance = 28 + Math.random() * 28;
                shard.className = "effect-burst";
                shard.style.left = `${x}px`;
                shard.style.top = `${y}px`;
                shard.style.color = color;
                shard.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
                shard.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
                arena.appendChild(shard);
                setTimeout(() => {
                    shard.remove();
                    activeEffects.bursts--;
                }, 500);
            }
        }

        function megaBurst(x, y, color, count = 8) {
            burst(x, y, color, count);
            effectRing(x, y, battle.ballSize * 1.8, color);
            impactStar(x, y, color);
        }

        function floatText(text, x, y, color = "#ba1a1a") {
            if (activeEffects.floatTexts >= EFFECT_LIMITS.floatTexts) {
                return;
            }

            activeEffects.floatTexts++;
            const label = document.createElement("div");
            label.className = "damage-float";
            label.textContent = text;
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            label.style.color = color;
            arena.appendChild(label);
            setTimeout(() => {
                label.remove();
                activeEffects.floatTexts--;
            }, 820);
        }

        function skillLabel(text, fighter) {
            if (activeEffects.skillLabels >= EFFECT_LIMITS.skillLabels) {
                return;
            }

            activeEffects.skillLabels++;
            const label = document.createElement("div");
            label.className = "skill-label";
            label.textContent = text;
            label.style.left = `${fighter.x}px`;
            label.style.top = `${fighter.y - battle.ballSize / 2}px`;
            arena.appendChild(label);
            setTimeout(() => {
                label.remove();
                activeEffects.skillLabels--;
            }, 760);
        }

        function reduceCooldown(fighter, seconds) {
            if (!Number.isFinite(seconds) || seconds <= 0 || fighter.dead
                || (fighter.definition.id !== "faker" && isStunned(fighter, performance.now()))) {
                return;
            }

            const cooldowns = ensureSkillCooldowns(fighter);
            for (let i = 0; i < cooldowns.length; i += 1) {
                cooldowns[i] = Math.max(0, cooldowns[i] - seconds);
            }
            fighter.skillCooldown = cooldowns[0] ?? 0;
        }

        function addDamageReduction(fighter, gain, cap) {
            if (!fighter || !Number.isFinite(gain) || gain <= 0) {
                return;
            }

            if (!Number.isFinite(fighter.statDamageReduction)) {
                fighter.statDamageReduction = 0;
            }

            const maxCap = Number.isFinite(cap) && cap > 0 ? cap : 0;
            fighter.statDamageReductionCap = Math.max(fighter.statDamageReductionCap || 0, maxCap);
            fighter.statDamageReduction = maxCap > 0
                ? Math.min(maxCap, fighter.statDamageReduction + gain)
                : fighter.statDamageReduction + gain;
        }

        function sanitizeFighterState(fighter) {
            if (!fighter) {
                return;
            }

            if (!Number.isFinite(fighter.maxHp) || fighter.maxHp <= 0) {
                fighter.maxHp = fighter.definition.maxHp || 1;
            }
            if (!Number.isFinite(fighter.hp)) {
                fighter.hp = fighter.dead ? 0 : fighter.maxHp;
            }
            fighter.hp = Math.max(0, Math.min(fighter.maxHp, fighter.hp));

            ensureSkillCooldowns(fighter);
            if (!Number.isFinite(fighter.shield)) {
                fighter.shield = 0;
            }

            const center = battle.arenaSize / 2 || 300;
            if (!Number.isFinite(fighter.x)) {
                fighter.x = center;
            }
            if (!Number.isFinite(fighter.y)) {
                fighter.y = center;
            }
            if (!Number.isFinite(fighter.vx)) {
                fighter.vx = 0;
            }
            if (!Number.isFinite(fighter.vy)) {
                fighter.vy = 0;
            }
        }

        function healFighter(fighter, amount) {
            if (!fighter || fighter.dead || !Number.isFinite(amount) || amount <= 0) {
                return;
            }

            if (fighter.healingBlockedUntil > performance.now()) {
                floatText("회복 봉인", fighter.x, fighter.y - fighterRadius(fighter), "#7c3aed");
                return;
            }

            if (!Number.isFinite(fighter.hp)) {
                fighter.hp = Math.max(1, fighter.maxHp);
            }

            if (!Number.isFinite(fighter.maxHp) || fighter.maxHp <= 0 || fighter.hp >= fighter.maxHp) {
                return;
            }

            const healed = Math.min(amount, fighter.maxHp - fighter.hp);
            if (!Number.isFinite(healed) || healed <= 0) {
                return;
            }

            fighter.hp += healed;
            floatText(`+${Math.round(healed)}`, fighter.x, fighter.y - battle.ballSize / 2, "#006d36");
        }

        function applyDirectSelfDamage(fighter, amount, label) {
            if (!fighter || fighter.dead || !Number.isFinite(amount) || amount <= 0) {
                return 0;
            }

            const actual = Math.min(fighter.hp, amount);
            fighter.hp -= actual;
            floatText(`${label} -${Math.round(actual)}`, fighter.x, fighter.y - battle.ballSize / 2, "#ba1a1a");
            impactStar(fighter.x, fighter.y, "#ba1a1a");

            if (fighter.hp <= 0) {
                fighter.dead = true;
                fighter.vx = 0;
                fighter.vy = 0;
                fighter.element.style.zIndex = "1";
                burst(fighter.x, fighter.y, "#ba1a1a", 12);
                floatText("OUT", fighter.x, fighter.y, "#ba1a1a");
            }

            return actual;
        }

        function applyDamage(target, amount, source, kind) {
            const now = performance.now();
            if (!target || target.dead || !Number.isFinite(amount) || amount <= 0) {
                return 0;
            }

            if (source && source.charmedBy && target === source.charmedBy) {
                healFighter(target, amount);
                floatText("매혹 흡수", target.x, target.y - battle.ballSize / 2, target.definition.color);
                return 0;
            }

            if (!Number.isFinite(target.hp)) {
                target.hp = Math.max(1, target.maxHp);
            }
            if (!Number.isFinite(target.shield)) {
                target.shield = 0;
            }

            if (target.invulnerableUntil > now || target.offMapUntil > now) {
                floatText("MISS", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.1, target.definition.color);
                return 0;
            }

            const piercesBasicIgnore = kind === "basic" && source && characterModules.piercesBasicIgnore(source, target);

            const isBasicLike = kind === "basic" || kind === "ranged";

            if (isBasicLike && target.definition.evadesBasic && !piercesBasicIgnore) {
                floatText("DODGE", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.15, target.definition.color);
                const healRatio = target.definition.passive?.effects?.healOnBasicEvadeRatio || 0;
                healFighter(target, target.maxHp * healRatio);
                return 0;
            }

            if (isBasicLike && target.definition.immuneToBasic && !piercesBasicIgnore) {
                floatText("IMMUNE", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.2, target.definition.color);
                return 0;
            }

            if (piercesBasicIgnore && (target.definition.evadesBasic || target.definition.immuneToBasic)) {
                floatText("PIERCE", target.x, target.y - battle.ballSize / 2, source.definition.color);
            }

            if (source) {
                amount *= Number.isFinite(source.damageMultiplier) ? source.damageMultiplier : 1;
                if (isBossBattle && source.team === "party") {
                    amount *= window.HannamBalls.RAID_PARTY_DAMAGE_MULTIPLIER;
                }
                if (isBossBattle && target.isBoss && source.team === "party") {
                    amount *= target.raidIncomingDamageMultiplier || 1;
                }
                if (isBossBattle && target.isBoss && source.definition.id === "jeong-yuseung" && kind === "passive") {
                    amount *= window.HannamBalls.RAID_JEONG_YUSEUNG_PASSIVE_MULTIPLIER;
                }
            }

            const permanentReduction = Number.isFinite(target.statDamageReduction) ? target.statDamageReduction : 0;
            const temporaryReduction = target.tempDamageReductionUntil > now && Number.isFinite(target.tempDamageReduction) ? target.tempDamageReduction : 0;
            let reducedAmount = amount * Math.max(0.1, 1 - permanentReduction - temporaryReduction);
            if (target.definition.id === "bbangki") {
                const aliveMainFighters = battle.fighters.filter((fighter) => !fighter.dead && !fighter.isSummon).length;
                if (aliveMainFighters <= 2) {
                    reducedAmount *= target.definition.passive?.effects?.duelDamageTakenMultiplier || 1;
                }
            }

            let damageToHp = reducedAmount;
            if (target.shield > 0) {
                const absorbed = Math.min(target.shield, damageToHp);
                target.shield -= absorbed;
                damageToHp -= absorbed;
                floatText(`ABSORB ${Math.round(absorbed)}`, target.x, target.y - battle.ballSize / 2, "#38bdf8");
                effectRing(target.x, target.y, battle.ballSize * 1.1, "#38bdf8");
            }

            damageToHp = characterModules.applyThresholdShield(target, damageToHp, now);

            const actual = Math.min(target.hp, damageToHp);
            target.hp -= actual;
            const isDot = characterModules.isDotDamage(kind, source);
            const canShowDot = !isDot || now >= target.nextDotFloatAt;

            if (canShowDot) {
                floatText(`-${Math.round(actual)}`, target.x, target.y - battle.ballSize / 2);
                if (isDot) {
                    target.nextDotFloatAt = now + 850;
                }
            }

            if (!isDot) {
                impactStar(target.x, target.y, source ? source.definition.color : "#ba1a1a");
            }

            if (kind === "skill") {
                effectRing(target.x, target.y, battle.ballSize * 1.35, source ? source.definition.color : "#ba1a1a");
            }

            if (actual > 0 && source && source.isSummon) {
                const owner = getFighterById(source.ownerId);
                healFighter(source, actual * (source.definition.selfHealRatioFromDamage || 0));
                if (owner && !owner.dead) {
                    healFighter(owner, actual * (source.definition.ownerHealRatioFromDamage || 0));
                }
            }

            if (actual > 0 && source?.definition.id === "faker") {
                reduceCooldown(source, source.definition.cooldownOnBasicHit);
            }

            if (actual > 0 && target.definition.id === "roh-moohyun" && !target.dead) {
                maybeSpawnRohMics(target, now);
            }

            if (!isStunned(target, now) || target.definition.id === "faker") {
                reduceCooldown(target, target.definition.cooldownOnDamageTaken);
            }

            if (target.hp <= 0) {
                target.dead = true;
                target.vx = 0;
                target.vy = 0;
                const despawn = shouldDespawnOnDeath(target);
                const deathX = target.x;
                const deathY = target.y;
                burst(deathX, deathY, "#ba1a1a", 12);
                floatText(target.isMapObject ? "파괴" : (despawn ? "소멸" : "OUT"), deathX, deathY, "#ba1a1a");
                if (target.isMapObject) {
                    resolveMapObjectDeath(target, source, now);
                    removeFighterCompletely(target);
                } else if (despawn) {
                    characterModules.onKill(source, target);
                    removeFighterCompletely(target);
                    renderHud();
                } else {
                    if (target.element) {
                        target.element.style.zIndex = "1";
                    }
                    characterModules.onKill(source, target);
                }
            }

            return actual;
        }

        function executeFighter(target, source, label = "처형") {
            if (!target || target.dead || areAllies(target, source)) return false;
            const deathX = target.x;
            const deathY = target.y;
            const radius = fighterRadius(target);
            target.hp = 0;
            target.shield = 0;
            target.dead = true;
            target.vx = 0;
            target.vy = 0;
            floatText(label, deathX, deathY - radius, "#ef4444");
            megaBurst(deathX, deathY, "#ef4444", 12);
            characterModules.onKill(source, target);
            if (shouldDespawnOnDeath(target)) {
                removeFighterCompletely(target);
                renderHud();
            } else if (target.element) {
                target.element.style.zIndex = "1";
            }
            return true;
        }

        function stun(target, seconds, now) {
            if (target.dead) {
                return;
            }

            if (isUnstoppable(target, now)) {
                floatText("저지불가", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.2, target.definition.color);
                return;
            }

            if (!isStunned(target, now)) {
                target.savedVelocity = { vx: target.vx, vy: target.vy };
            }

            const durationMultiplier = (target.definition.crowdControlDurationMultiplier || 1)
                * (target.raidCcDurationMultiplier || 1);
            target.stunnedUntil = Math.max(target.stunnedUntil, now + seconds * durationMultiplier * 1000);
            target.vx = 0;
            target.vy = 0;
        }

        function restoreFromStun(fighter, now) {
            if (fighter.dead || fighter.stunnedUntil === 0 || isStunned(fighter, now)) {
                return;
            }

            if (fighter.savedVelocity) {
                fighter.vx = fighter.savedVelocity.vx;
                fighter.vy = fighter.savedVelocity.vy;
                setVelocitySpeed(fighter, moveSpeedOf(fighter, now));
            }

            fighter.savedVelocity = null;
            fighter.stunnedUntil = 0;
        }

        function updateCenterLock(fighter, now) {
            if (!fighter.centerLockUntil) {
                return false;
            }

            const center = battle.arenaSize / 2;
            if (now < fighter.centerLockUntil) {
                fighter.x = center;
                fighter.y = center;
                fighter.vx = 0;
                fighter.vy = 0;
                if (!fighter.nextCenterLockPulseAt || now >= fighter.nextCenterLockPulseAt) {
                    fighter.nextCenterLockPulseAt = now + 650;
                    effectRing(center, center, battle.ballSize * 1.9, fighter.definition.color);
                }
                return true;
            }

            if (fighter.mukbangUntil && !fighter.mukbangResolved) {
                const ratio = fighter.mukbangFailRatio || fighter.definition.skill.effects.failSelfDamageRatio || 0.075;
                fighter.mukbangResolved = true;
                fighter.tempDamageReductionUntil = Math.min(fighter.tempDamageReductionUntil || 0, now);
                applyDirectSelfDamage(fighter, fighter.maxHp * ratio, "먹방실패");
                effectRing(fighter.x, fighter.y, battle.ballSize * 1.5, "#ba1a1a");
                burst(fighter.x, fighter.y, "#ba1a1a", 6);
            }

            fighter.centerLockUntil = 0;
            fighter.mukbangUntil = 0;
            fighter.mukbangStealRatio = 0;
            fighter.mukbangFailRatio = 0;
            fighter.mukbangTargetId = null;
            return false;
        }

        function updateSwallowed(fighter, now) {
            if (!fighter.swallowedById || fighter.dead) {
                return false;
            }
            if (now < fighter.swallowedHideAt) {
                fighter.vx = 0;
                fighter.vy = 0;
                return true;
            }
            if (now < fighter.swallowedUntil) {
                fighter.offMapUntil = fighter.swallowedUntil;
                fighter.invulnerableUntil = fighter.swallowedUntil;
                return true;
            }
            fighter.swallowedById = null;
            fighter.swallowedHideAt = 0;
            fighter.swallowedUntil = 0;
            return false;
        }

        function updateBbangkiCrash(fighter, now) {
            if (!fighter.bbangkiCrashAt || now < fighter.bbangkiCrashAt) {
                return;
            }

            const ratio = fighter.bbangkiCrashRatio || 0.07;
            fighter.bbangkiCrashAt = 0;
            fighter.bbangkiCrashRatio = 0;
            fighter.hasteUntil = Math.min(fighter.hasteUntil || 0, now);
            fighter.tempDamageReductionUntil = Math.min(fighter.tempDamageReductionUntil || 0, now);
            fighter.slowMultiplier = 0.72;
            fighter.slowUntil = now + 900;
            applyDirectSelfDamage(fighter, fighter.maxHp * ratio, "현타");
            effectRing(fighter.x, fighter.y, battle.ballSize * 1.35, "#ba1a1a");
        }

        function updateCachedCorners() {
            const radius = battle.ballSize / 2;
            cachedCorners = [
                { x: radius, y: radius },
                { x: battle.arenaSize - radius, y: radius },
                { x: battle.arenaSize - radius, y: battle.arenaSize - radius },
                { x: radius, y: battle.arenaSize - radius }
            ];
        }

        function arenaCorners() {
            return cachedCorners;
        }

        function steerToCorner(fighter, dt, now) {
            const corners = arenaCorners();
            const target = corners[fighter.cornerIndex % corners.length];
            const dx = target.x - fighter.x;
            const dy = target.y - fighter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < battle.ballSize * 0.35) {
                fighter.cornerIndex = (fighter.cornerIndex + 1) % corners.length;
            }

            const nextTarget = corners[fighter.cornerIndex % corners.length];
            const direction = normalize(nextTarget.x - fighter.x, nextTarget.y - fighter.y);
            fighter.vx = direction.x * scaledSpeed(moveSpeedOf(fighter, now));
            fighter.vy = direction.y * scaledSpeed(moveSpeedOf(fighter, now));

            if (fighter.passiveDropEnabled !== false && now >= fighter.nextPuddleAt) {
                createPuddle(fighter, now);
                fighter.nextPuddleAt = now + fighter.definition.passive.effects.dropInterval * 1000;
            }
        }

        function createPuddle(fighter, now) {
            if (!fighter.definition.passive) {
                return;
            }

            const effects = fighter.definition.passive.effects;
            const ownPuddles = battle.activePuddles.filter((puddle) => puddle.source === fighter);
            if (ownPuddles.length >= effects.maxActivePuddles) {
                const oldest = ownPuddles[0];
                oldest.expiresAt = now;
                oldest.element.remove();
                battle.activePuddles = battle.activePuddles.filter((puddle) => puddle !== oldest);
            }

            const puddle = document.createElement("div");
            const radius = Math.max(28, Math.min(effects.puddleRadius, battle.arenaSize * (effects.puddleRadiusRatio || 0.105)));
            const size = radius * 2;
            puddle.className = "puddle-zone";
            puddle.style.left = `${fighter.x}px`;
            puddle.style.top = `${fighter.y}px`;
            puddle.style.width = `${size}px`;
            puddle.style.height = `${size}px`;
            arena.appendChild(puddle);

            battle.activePuddles.push({
                source: fighter,
                x: fighter.x,
                y: fighter.y,
                radius,
                damage: effects.puddleDamage,
                healRatio: effects.healRatio,
                tickInterval: effects.puddleTickInterval,
                nextTickAt: now + effects.puddleTickInterval * 1000,
                expiresAt: now + effects.puddleDuration * 1000,
                element: puddle
            });
        }

        function updatePuddles(now) {
            battle.activePuddles = battle.activePuddles.filter((puddle) => {
                if (now >= puddle.expiresAt || puddle.source.dead) {
                    puddle.element.remove();
                    return false;
                }

                if (now < puddle.nextTickAt) {
                    return true;
                }

                puddle.nextTickAt = now + puddle.tickInterval * 1000;
                battle.fighters.forEach((target) => {
                    if (target === puddle.source || target.dead || target.offMapUntil > now || areAllies(puddle.source, target)) {
                        return;
                    }

                    const dx = target.x - puddle.x;
                    const dy = target.y - puddle.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= puddle.radius + battle.ballSize * 0.35) {
                        const dealt = applyDamage(target, puddle.damage, puddle.source, "basic");
                        if (dealt > 0) {
                            reduceCooldown(puddle.source, puddle.source.definition.cooldownOnBasicHit);
                            healFighter(puddle.source, dealt * puddle.healRatio);
                        }
                    }
                });

                return true;
            });
        }

        function createFlowerZone(fighter, now) {
            const effects = fighter.definition.passive.effects;
            const flower = document.createElement("div");
            const radius = effects.radius || 65;
            const size = radius * 2;
            flower.className = "flower-zone";
            flower.style.left = `${fighter.x}px`;
            flower.style.top = `${fighter.y}px`;
            flower.style.width = `${size}px`;
            flower.style.height = `${size}px`;
            arena.appendChild(flower);

            battle.activeFlowerZones.push({
                source: fighter,
                x: fighter.x,
                y: fighter.y,
                radius,
                damagePerSecond: effects.damagePerSecond || 22,
                tickInterval: effects.tickInterval || 0.2,
                healRatio: effects.healRatio || 0,
                nextTickAt: now + (effects.tickInterval || 0.2) * 1000,
                expiresAt: now + (effects.duration || 2) * 1000,
                element: flower
            });

            if (window.flowerZoneParticles) {
                window.flowerZoneParticles(fighter.x, fighter.y, radius, fighter.definition.color);
            }
        }

        function updateFlowerZones(now) {
            battle.activeFlowerZones = battle.activeFlowerZones.filter((flower) => {
                if (now >= flower.expiresAt || flower.source.dead) {
                    flower.element.remove();
                    return false;
                }

                if (now < flower.nextTickAt) {
                    return true;
                }

                flower.nextTickAt = now + flower.tickInterval * 1000;

                if (window.flowerZoneParticles && Math.random() < 0.45 * performanceProfile.effectScale) {
                    window.flowerZoneParticles(flower.x, flower.y, flower.radius, flower.source.definition.color);
                }

                battle.fighters.forEach((target) => {
                    if (target === flower.source || target.dead || target.offMapUntil > now || areAllies(flower.source, target)) {
                        return;
                    }

                    const dx = target.x - flower.x;
                    const dy = target.y - flower.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= flower.radius + battle.ballSize * 0.35) {
                        const damage = flower.damagePerSecond * flower.tickInterval;
                        const dealt = applyDamage(target, damage, flower.source, "passive");
                        if (dealt > 0 && flower.healRatio) {
                            healFighter(flower.source, dealt * flower.healRatio);
                        }
                    }
                });

                return true;
            });
        }

        function spawnWorldsTrophy(now) {
            if (!isBossBattle) return;
            const margin = battle.ballSize * 1.2;
            const element = document.createElement("div");
            element.className = "worlds-trophy";
            const trophy = {
                x: margin + Math.random() * Math.max(1, battle.arenaSize - margin * 2),
                y: margin + Math.random() * Math.max(1, battle.arenaSize - margin * 2),
                element,
                spawnedAt: now
            };
            element.style.left = `${trophy.x}px`;
            element.style.top = `${trophy.y}px`;
            arena.appendChild(element);
            battle.activeTrophies.push(trophy);
            while (battle.activeTrophies.length > 4) {
                battle.activeTrophies.shift().element.remove();
            }
            floatText("월즈 트로피!", trophy.x, trophy.y - 32, "#f59e0b");
        }

        function reviveRaidAlly(collector, trophy) {
            const deadAllies = battle.fighters.filter((fighter) => fighter.team === collector.team && fighter.dead && !fighter.isSummon);
            if (!deadAllies.length) return false;
            const revived = deadAllies[Math.floor(Math.random() * deadAllies.length)];
            revived.dead = false;
            revived.hp = Math.max(1, revived.maxHp * 0.4);
            revived.shield = 0;
            revived.x = trophy.x;
            revived.y = trophy.y;
            revived.invulnerableUntil = performance.now() + 1500;
            revived.element.style.zIndex = "";
            setVelocityDirection(revived, Math.random() - 0.5, Math.random() - 0.5, revived.speed);
            floatText(`${revived.definition.name} 부활!`, trophy.x, trophy.y - 42, "#22c55e");
            megaBurst(trophy.x, trophy.y, "#22c55e", 10);
            return true;
        }

        function collectWorldsTrophy(fighter, trophy, now) {
            const boss = battle.fighters.find((target) => target.isBoss && !target.dead);
            if (fighter.isBoss) {
                fighter.lastBossTrophyAt = now;
                healFighter(fighter, fighter.maxHp * (fighter.definition.skill.effects.trophyHealRatio || 0.1557));
                floatText("트로피 흡수", trophy.x, trophy.y - 32, fighter.definition.color);
            } else {
                fighter.damageMultiplier = 2;
                if (boss) {
                    boss.healingBlockedUntil = Math.max(boss.healingBlockedUntil || 0, now + (boss.definition.skill.effects.healingBlockDuration || 15.57) * 1000);
                    if (boss.gogeonpaUntil > now) reviveRaidAlly(fighter, trophy);
                }
                floatText("피해량 2배!", trophy.x, trophy.y - 32, "#f97316");
            }
            trophy.element.remove();
        }

        function updateWorldsTrophies(now) {
            if (!isBossBattle) return;
            if (now >= (battle.nextTrophyAt || Infinity)) {
                spawnWorldsTrophy(now);
                battle.nextTrophyAt = now + 6000;
            }
            battle.activeTrophies = battle.activeTrophies.filter((trophy) => {
                const collector = battle.fighters.find((fighter) => !fighter.dead
                    && fighter.offMapUntil <= now
                    && Math.hypot(fighter.x - trophy.x, fighter.y - trophy.y) <= fighterRadius(fighter) + 24);
                if (!collector) return true;
                collectWorldsTrophy(collector, trophy, now);
                return false;
            });
        }

        function createPoisonField(source, now, copiedEffects = null) {
            const effects = copiedEffects || source.definition.skill.effects;
            const field = document.createElement("div");
            field.className = "poison-field";
            arena.appendChild(field);
            const poisonObj = {
                source,
                damage: effects.poisonDps * effects.tickInterval,
                tickInterval: effects.tickInterval,
                nextTickAt: now + effects.tickInterval * 1000,
                expiresAt: now + effects.duration * 1000,
                element: field
            };
            if (source.charmedBy) {
                poisonObj.charmedBy = source.charmedBy;
            }
            battle.activePoisons.push(poisonObj);
        }

        /**
         * 양태훈 패시브/스킬 독. kind="poison"이라 기본 공격 면역과 무관.
         * 중첩 없음 — 남은 지속시간이 있으면 연장.
         */
        function applyTaehoonPoison(target, source, now, durationSeconds) {
            if (!target || target.dead || target.isMapObject || !source) {
                return false;
            }
            const passive = source.definition?.id === "yang-taehoon"
                ? (source.definition.passive?.effects || {})
                : (window.HannamBalls.getCharacter?.("yang-taehoon")?.passive?.effects || {});
            const durationMs = Math.max(0.1, durationSeconds || passive.poisonDuration || 5) * 1000;
            const dps = passive.poisonDps || 4;
            const tickInterval = passive.poisonTickInterval || 1;
            const existing = target.taehoonPoison;
            if (existing && existing.expiresAt > now) {
                existing.expiresAt += durationMs;
                existing.source = source;
                existing.sourceId = source.id;
                existing.dps = dps;
                existing.tickInterval = tickInterval;
                floatText(`독 연장 +${(durationMs / 1000).toFixed(1)}초`, target.x, target.y - battle.ballSize / 2, "#7c3aed");
                return true;
            }
            target.taehoonPoison = {
                source,
                sourceId: source.id,
                dps,
                tickInterval,
                nextTickAt: now + tickInterval * 1000,
                expiresAt: now + durationMs
            };
            floatText(`독 ${durationSeconds || 5}초`, target.x, target.y - battle.ballSize / 2, "#7c3aed");
            return true;
        }

        function updateTaehoonPoisons(now) {
            battle.fighters.forEach((target) => {
                const poison = target.taehoonPoison;
                if (!poison) {
                    return;
                }
                if (target.dead || now >= poison.expiresAt) {
                    target.taehoonPoison = null;
                    return;
                }
                if (now < poison.nextTickAt) {
                    return;
                }
                poison.nextTickAt = now + (poison.tickInterval || 1) * 1000;
                const source = poison.source && !poison.source.dead
                    ? poison.source
                    : (getFighterById(poison.sourceId) || poison.source);
                // 독 틱은 기본 공격 판정이 아님 (kind: poison)
                const dealt = applyDamage(target, poison.dps * (poison.tickInterval || 1), source, "poison");
                if (dealt > 0 && now >= (target.nextDotFloatAt || 0)) {
                    target.nextDotFloatAt = now + 450;
                    floatText(`독 -${Math.round(dealt)}`, target.x, target.y - battle.ballSize / 2, "#7c3aed");
                }
            });
        }

        function updatePoisons(now) {
            battle.activePoisons = battle.activePoisons.filter((poison) => {
                if (now >= poison.expiresAt || poison.source.dead) {
                    poison.element.remove();
                    return false;
                }

                if (now < poison.nextTickAt) {
                    return true;
                }

                poison.nextTickAt = now + poison.tickInterval * 1000;
                battle.fighters.forEach((target) => {
                    if (target === poison.source || target.dead || target.offMapUntil > now || areAllies(poison.source, target)) {
                        return;
                    }

                    const originalCharmedBy = poison.source.charmedBy;
                    if (poison.charmedBy) poison.source.charmedBy = poison.charmedBy;

                    applyDamage(target, poison.damage, poison.source, "poison");

                    poison.source.charmedBy = originalCharmedBy;
                });

                return true;
            });
        }

        function createIceZone(source, now, effects) {
            const vertical = Math.random() < 0.5;
            const highSide = Math.random() < 0.5;
            const zone = document.createElement("div");
            zone.className = "ice-field";
            zone.style.left = vertical && highSide ? `${battle.arenaSize / 2}px` : "0px";
            zone.style.top = !vertical && highSide ? `${battle.arenaSize / 2}px` : "0px";
            zone.style.width = vertical ? `${battle.arenaSize / 2}px` : `${battle.arenaSize}px`;
            zone.style.height = vertical ? `${battle.arenaSize}px` : `${battle.arenaSize / 2}px`;
            arena.appendChild(zone);

            const ice = {
                source,
                vertical,
                highSide,
                expiresAt: now + (effects.iceZoneDuration || 2.4) * 1000,
                element: zone
            };
            battle.activeIceZones.push(ice);
            effectRing(battle.arenaSize / 2, battle.arenaSize / 2, battle.arenaSize * 1.05, source.definition.color);
            return ice;
        }

        function isInsideIceZone(fighter, ice) {
            return ice.vertical
                ? (ice.highSide ? fighter.x >= battle.arenaSize / 2 : fighter.x < battle.arenaSize / 2)
                : (ice.highSide ? fighter.y >= battle.arenaSize / 2 : fighter.y < battle.arenaSize / 2);
        }

        function updateIceZones(now) {
            battle.activeIceZones = battle.activeIceZones.filter((ice) => {
                if (now >= ice.expiresAt || ice.source.dead) {
                    ice.element.remove();
                    return false;
                }
                return true;
            });
        }

        function restoreFromOffMap(fighter, now) {
            if (fighter.offMapUntil === 0 || fighter.offMapUntil > now) {
                return;
            }

            const corners = arenaCorners();
            const corner = corners[fighter.cornerIndex % corners.length];
            fighter.x = corner.x;
            fighter.y = corner.y;
            fighter.invulnerableUntil = 0;
            fighter.offMapUntil = 0;
            megaBurst(fighter.x, fighter.y, fighter.definition.color, 4);
        }

        function nearestEnemy(fighter, options = {}) {
            let nearest = null;
            let nearestDistance = Infinity;
            battle.fighters.forEach((target) => {
                if (target === fighter || target.dead || target.offMapUntil > performance.now() || areAllies(fighter, target)) {
                    return;
                }
                if (!options.includeMapObjects && target.isMapObject) {
                    return;
                }

                const distance = Math.hypot(target.x - fighter.x, target.y - fighter.y);
                if (distance < nearestDistance) {
                    nearest = target;
                    nearestDistance = distance;
                }
            });
            return nearest;
        }

        function randomEnemy(fighter) {
            const enemies = livingEnemiesOf(fighter);
            if (enemies.length === 0) {
                return null;
            }
            return enemies[Math.floor(Math.random() * enemies.length)];
        }

        function highestCurrentHpEnemy(fighter) {
            return livingEnemiesOf(fighter).reduce((highest, enemy) => {
                if (!highest || enemy.hp > highest.hp) {
                    return enemy;
                }
                return highest;
            }, null);
        }

        function applyCurrentHpRatioDamage(target, ratio, source, kind = "skill") {
            if (!target || target.dead || !Number.isFinite(ratio) || ratio <= 0) {
                return 0;
            }

            const adjustedRatio = isBossBattle && target.isBoss && source?.team === "party"
                ? ratio * window.HannamBalls.RAID_BOSS_RATIO_DAMAGE_MULTIPLIER
                : ratio;
            return applyDamage(target, Math.max(0, target.hp * adjustedRatio), source, kind);
        }

        function applyMaxHpRatioDamage(target, ratio, source, kind = "skill") {
            if (!target || target.dead || !Number.isFinite(ratio) || ratio <= 0) {
                return 0;
            }

            const adjustedRatio = isBossBattle && target.isBoss && source?.team === "party"
                ? ratio * window.HannamBalls.RAID_BOSS_RATIO_DAMAGE_MULTIPLIER
                : ratio;
            return applyDamage(target, Math.max(0, target.maxHp * adjustedRatio), source, kind);
        }

        function applyCopiedSkill(fighter, copiedFrom, now) {
            const copiedTarget = copiedFrom && copiedFrom !== fighter && !copiedFrom.dead && copiedFrom.offMapUntil <= now && !areAllies(fighter, copiedFrom)
                ? copiedFrom
                : nearestEnemy(fighter);
            if (!copiedTarget) {
                healFighter(fighter, fighter.maxHp * 0.33);
