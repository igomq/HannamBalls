        function removeBombLabel(bomb) {
            if (bomb.label) {
                bomb.label.remove();
                bomb.label = null;
            }
        }

        function updateBombLabel(bomb, now) {
            if (!bomb.label) {
                return;
            }

            const remaining = Math.max(0, (bomb.explodeAt - now) / 1000);
            bomb.label.textContent = `💣 ${remaining.toFixed(1)}초`;
            bomb.label.classList.toggle("bomb-urgent", remaining < 1.5);
            if (remaining < 1.5 && (!bomb.nextPulseAt || now >= bomb.nextPulseAt)) {
                bombPulseEffect(bomb.target.x, bomb.target.y, bomb.source.definition.color);
                bomb.nextPulseAt = now + 400;
            }
            bomb.label.style.left = `${bomb.target.x}px`;
            bomb.label.style.top = `${bomb.target.y - battle.ballSize * 0.72}px`;
        }

        function plantBomb(source, target, now, copiedEffects = null) {
            const effects = copiedEffects || source.definition.skill.effects;
            const label = document.createElement("div");
            label.className = "bomb-timer";
            label.style.color = source.definition.color;
            arena.appendChild(label);
            const bombObj = {
                source,
                target,
                explodeAt: now + effects.delay * 1000,
                effects,
                label
            };
            if (source.charmedBy) {
                bombObj.charmedBy = source.charmedBy;
            }
            battle.activeBombs.push(bombObj);
            updateBombLabel(bombObj, now);
            floatText("폭탄임신", target.x, target.y - battle.ballSize / 2, source.definition.color);
            effectRing(target.x, target.y, battle.ballSize * 1.75, source.definition.color);
            burst(target.x, target.y, source.definition.color, 6);
        }

        function updateBombs(now) {
            battle.activeBombs = battle.activeBombs.filter((bomb) => {
                if (bomb.source.dead || bomb.target.dead) {
                    removeBombLabel(bomb);
                    return false;
                }
                if (now < bomb.explodeAt) {
                    updateBombLabel(bomb, now);
                    return true;
                }

                const { source, target, effects } = bomb;
                removeBombLabel(bomb);
                explosionFire(target.x, target.y, effects.radius, source.definition.color);
                megaBurst(target.x, target.y, source.definition.color, 8);
                effectRing(target.x, target.y, effects.radius * 2, source.definition.color);
                floatText("💥펑!", target.x, target.y - battle.ballSize / 2, source.definition.color);

                const originalCharmedBy = source.charmedBy;
                if (bomb.charmedBy) source.charmedBy = bomb.charmedBy;

                applyDamage(target, effects.targetDamage, source, "skill");
                stun(target, effects.stunSeconds, now);
                battle.fighters.forEach((enemy) => {
                    if (enemy === target || enemy === source || enemy.dead || areAllies(source, enemy)) {
                        return;
                    }
                    const dx = enemy.x - target.x;
                    const dy = enemy.y - target.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= effects.radius) {
                        applyDamage(enemy, effects.splashDamage, source, "skill");
                        stun(enemy, effects.stunSeconds, now);
                        impactStar(enemy.x, enemy.y, source.definition.color);
                    }
                });

                source.charmedBy = originalCharmedBy;
                return false;
            });
        }

        function updateRangedAttacks(fighter, now) {
            const effects = fighter.definition.passive?.effects;
            if (!effects?.rangedAttack || fighter.dead) {
                return;
            }

            if (!fighter.nextRangedGrowthAt) {
                fighter.nextRangedGrowthAt = (battle.fightStartedAt || now) + effects.growthInterval * 1000;
            }
            while (now >= fighter.nextRangedGrowthAt) {
                fighter.rangedDamageBonus += effects.growthDamage;
                fighter.nextRangedGrowthAt += effects.growthInterval * 1000;
                floatText(`딱콩+${effects.growthDamage}`, fighter.x, fighter.y - battle.ballSize / 2, fighter.definition.color);
            }

            if (now < fighter.nextRangedAt) {
                return;
            }

            const target = nearestEnemy(fighter);
            if (!target) {
                return;
            }

            const damage = effects.damage + fighter.rangedDamageBonus;
            const dealt = applyDamage(target, damage, fighter, "ranged");
            impactStar(target.x, target.y, fighter.definition.color);
            if (Math.random() < 0.35) {
                effectRing(target.x, target.y, battle.ballSize * 1.05, fighter.definition.color);
            }
            if (dealt > 0) {
                healFighter(fighter, dealt * effects.healRatio);
            }
            fighter.nextRangedAt = now + effects.interval * 1000;
        }

        function resolveBackstab(fighter, now) {
            if (!fighter.backstab || now < fighter.backstab.returnAt) {
                return false;
            }

            const target = getFighterById(fighter.backstab.targetId) || randomEnemy(fighter);
            fighter.offMapUntil = 0;
            fighter.invulnerableUntil = 0;
            if (target && !target.dead) {
                const direction = normalize(target.vx || 1, target.vy || 1);
                const distance = fighter.backstab.behindDistance;
                fighter.x = Math.max(battle.ballSize / 2, Math.min(battle.arenaSize - battle.ballSize / 2, target.x - direction.x * distance));
                fighter.y = Math.max(battle.ballSize / 2, Math.min(battle.arenaSize - battle.ballSize / 2, target.y - direction.y * distance));
                fighter.vx = direction.x * scaledSpeed(fighter.speed);
                fighter.vy = direction.y * scaledSpeed(fighter.speed);

                const originalCharmedBy = fighter.charmedBy;
                if (fighter.backstabCharmedBy) fighter.charmedBy = fighter.backstabCharmedBy;

                const dealt = applyDamage(target, fighter.backstab.damage, fighter, "skill");
                if (dealt > 0 && fighter.backstab.healRatio) {
                    healFighter(fighter, dealt * fighter.backstab.healRatio);
                }

                fighter.charmedBy = originalCharmedBy;

                stealthReveal(fighter.x, fighter.y, fighter.definition.color);
                megaBurst(fighter.x, fighter.y, fighter.definition.color, 5);
                effectRing(target.x, target.y, battle.ballSize * 1.65, fighter.definition.color);
                impactStar(target.x, target.y, fighter.definition.color);
                floatText("🗡️뒷치기!", target.x, target.y - battle.ballSize / 2, fighter.definition.color);
            } else {
                const direction = normalize(Math.random() - 0.5, Math.random() - 0.5);
                fighter.vx = direction.x * scaledSpeed(fighter.speed);
                fighter.vy = direction.y * scaledSpeed(fighter.speed);
            }
            fighter.backstab = null;
            fighter.backstabCharmedBy = null;
            return true;
        }

        function summonFighter(owner, summonDefinition, now, options = {}) {
            const definition = JSON.parse(JSON.stringify(summonDefinition));
            const summon = createFighter(definition, battle.fighters.length, battle.fighters.length + 1, {
                id: `${owner.id}-${options.idPrefix || "summon"}-${Math.round(now)}-${Math.floor(Math.random() * 1000)}`,
                ownerId: owner.id,
                team: options.team !== undefined ? options.team : owner.team,
                isSummon: true,
                isMapObject: Boolean(options.isMapObject || definition.isMapObject),
                mapObjectKind: options.mapObjectKind || definition.mapObjectKind || null,
                mapExpireAt: options.mapExpireAt || 0
            });
            if (owner?.charmedBy) {
                summon.charmedBy = owner.charmedBy;
            }
            const angle = Math.atan2(owner?.vy || 1, owner?.vx || 1) + Math.PI / 2;
            const distance = battle.ballSize * 1.25;
            const baseX = options.x ?? (owner.x + Math.cos(angle) * distance);
            const baseY = options.y ?? (owner.y + Math.sin(angle) * distance);
            summon.x = Math.max(battle.ballSize / 2, Math.min(battle.arenaSize - battle.ballSize / 2, baseX));
            summon.y = Math.max(battle.ballSize / 2, Math.min(battle.arenaSize - battle.ballSize / 2, baseY));
            if (summon.definition.immobile || summon.isMapObject) {
                summon.vx = 0;
                summon.vy = 0;
            } else {
                const center = battle.arenaSize / 2;
                const direction = normalize(center - summon.x, center - summon.y);
                summon.vx = direction.x * scaledSpeed(summon.speed);
                summon.vy = direction.y * scaledSpeed(summon.speed);
            }
            // 부엉이: HUD/잔상 제외 플래그를 fighter에 강제 고정
            if (
                definition.id === "roh-owl"
                || definition.name === "부엉이"
                || definition.hideFromHud
                || definition.despawnOnDeath
            ) {
                summon.isRohOwl = definition.id === "roh-owl" || definition.name === "부엉이";
                summon.hideFromHud = true;
                summon.despawnOnDeath = true;
                if (summon.definition) {
                    summon.definition.hideFromHud = true;
                    summon.definition.despawnOnDeath = true;
                }
            }
            // 부엉이는 소환 직후 바위를 바로 떨굴 수 있게 준비
            if (definition.id === "roh-owl" || summon.isRohOwl) {
                ensureSkillCooldowns(summon);
                summon.skillCooldowns[0] = 0.523;
                summon.skillCooldown = 0.523;
            }
            summon.element.style.width = `${battle.ballSize}px`;
            summon.element.style.height = `${battle.ballSize}px`;
            if (summon.isMapObject) {
                summon.element.classList.add("is-map-object");
            }
            battle.fighters.push(summon);
            // 부엉이 소환 시에도 정보창에 안 뜨도록 필터된 HUD만 갱신
            renderHud();
            megaBurst(summon.x, summon.y, owner?.definition?.color || definition.color, 6);
            floatText(options.label || `${definition.name} 등장`, summon.x, summon.y - battle.ballSize / 2, definition.color);
            return summon;
        }

        function createMapObjectDefinition(kind, config) {
            if (kind === "mic") {
                return {
                    id: "roh-mic",
                    name: "마이크",
                    shortName: "마이크",
                    maxHp: config.maxHp || 150,
                    baseAttack: 0,
                    speedLabel: "고정",
                    speed: 0,
                    colorName: "노래방 마이크",
                    color: "#1d4ed8",
                    textColor: "#ffffff",
                    avatarText: "MIC",
                    traits: ["맵 오브젝트", "비공격"],
                    skill: {
                        name: "응디",
                        cooldown: 9999,
                        description: "움직이지도 공격하지도 않습니다.",
                        effects: {}
                    },
                    cooldownOnBasicHit: 0,
                    cooldownOnDamageTaken: 0,
                    immuneToBasic: false,
                    contactAttackDisabled: true,
                    immobile: true,
                    isSummonDefinition: true,
                    isMapObject: true,
                    mapObjectKind: "mic",
                    noPushCollision: true
                };
            }

            return {
                id: "roh-piaget",
                name: "피아제",
                shortName: "피아제",
                maxHp: config.maxHp || 350,
                baseAttack: 0,
                speedLabel: "고정",
                speed: 0,
                colorName: "곧 논두렁에 버려질 피아제",
                color: "#ca8a04",
                textColor: "#1c1b1b",
                avatarText: "피아제",
                traits: ["맵 오브젝트", "비공격", "은닉 물품"],
                skill: {
                    name: "응디",
                    cooldown: 9999,
                    description: "움직이지도 공격하지도 않습니다.",
                    effects: {}
                },
                cooldownOnBasicHit: 0,
                cooldownOnDamageTaken: 0,
                immuneToBasic: false,
                contactAttackDisabled: true,
                immobile: true,
                isSummonDefinition: true,
                isMapObject: true,
                mapObjectKind: "piaget",
                noPushCollision: true
            };
        }

        function randomMapObjectPosition() {
            const margin = battle.ballSize * 1.4;
            return {
                x: margin + Math.random() * Math.max(1, battle.arenaSize - margin * 2),
                y: margin + Math.random() * Math.max(1, battle.arenaSize - margin * 2)
            };
        }

        /**
         * 노무현 마이크: 최대 체력 대비 5.23% 구간을 새로 내려갈 때마다 1회만 소환.
         * 회복 후 같은 구간(예: 94.77%)을 다시 통과해도 재소환하지 않음.
         * (툴팁 문구는 변경하지 않음)
         */
        function maybeSpawnRohMics(boss, now) {
            const config = boss.definition.mapEffects?.mic;
            if (!config || boss.dead) {
                return;
            }

            const ratio = config.damageThresholdRatio || 0.0523;
            const thresholdHp = boss.maxHp * ratio;
            if (!(thresholdHp > 0) || !(boss.maxHp > 0)) {
                return;
            }

            const missingHp = Math.max(0, boss.maxHp - Math.max(0, boss.hp));
            const segmentsReached = Math.floor(missingHp / thresholdHp + 1e-9);
            let claimed = Math.max(0, Math.floor(Number(boss.rohMicSegmentsClaimed) || 0));

            while (claimed < segmentsReached) {
                claimed += 1;
                boss.rohMicSegmentsClaimed = claimed;
                spawnRohMic(boss, now, config);
            }
        }

        function spawnRohMic(boss, now, config) {
            const pos = randomMapObjectPosition();
            const definition = createMapObjectDefinition("mic", config);
            const mic = summonFighter(boss, definition, now, {
                idPrefix: "mic",
                label: "마이크 소환",
                team: boss.team || "boss",
                isMapObject: true,
                mapObjectKind: "mic",
                mapExpireAt: now + (config.lifetime || 5) * 1000,
                x: pos.x,
                y: pos.y
            });
            mic.mapResolved = false;
            floatText("5초 안에 파괴!", mic.x, mic.y - battle.ballSize, "#38bdf8");
            return mic;
        }

        function spawnRohPiaget(boss, now, config) {
            const pos = randomMapObjectPosition();
            const definition = createMapObjectDefinition("piaget", config);
            const piaget = summonFighter(boss, definition, now, {
                idPrefix: "piaget",
                label: "피아제 소환",
                team: null,
                isMapObject: true,
                mapObjectKind: "piaget",
                mapExpireAt: now + (config.interval || 30) * 1000,
                x: pos.x,
                y: pos.y
            });
            piaget.mapResolved = false;
            floatText("피아제 은닉!", piaget.x, piaget.y - battle.ballSize, "#ca8a04");
            return piaget;
        }

        function resolveMapObjectDeath(target, source, now) {
            if (!target || target.mapResolved) {
                return;
            }
            target.mapResolved = true;
            const boss = getFighterById(target.ownerId) || battle.fighters.find((fighter) => fighter.isBoss && !fighter.dead);
            if (!boss || boss.definition.id !== "roh-moohyun") {
                return;
            }
            const mapEffects = boss.definition.mapEffects || {};

            if (target.mapObjectKind === "mic") {
                const config = mapEffects.mic || {};
                // 파티가 파괴 성공 → 전원 공격력 버프
                battle.fighters.forEach((fighter) => {
                    if (fighter.dead || fighter.isSummon || fighter.isBoss || fighter.team !== "party") {
                        return;
                    }
                    fighter.damageMultiplier = (fighter.damageMultiplier || 1) * (1 + (config.successAttackBuffRatio || 0.0523));
                });
                floatText("마이크 파괴! ATK+5.23%", target.x, target.y - battle.ballSize, "#4ade80");
                megaBurst(target.x, target.y, "#38bdf8", 8);
                return;
            }

            if (target.mapObjectKind === "piaget") {
                const config = mapEffects.piaget || {};
                const killedByBossSide = source && (source === boss || source.ownerId === boss.id || source.team === boss.team);
                if (killedByBossSide) {
                    // 노무현 파괴 성공 → 논두렁 + 회복
                    triggerNondurung(boss, now, config);
                } else {
                    // 파티 파괴 또는 기타 → 국정원 실패 처리
                    triggerPiagetFail(boss, now, config);
                }
            }
        }

        function triggerNondurung(boss, now, config) {
            const stunSeconds = config.successStunSeconds || 3;
            battle.fighters.forEach((fighter) => {
                if (fighter.dead || fighter.isBoss || fighter.isMapObject || fighter.team !== "party") {
                    return;
                }
                stun(fighter, stunSeconds, now);
            });
            healFighter(boss, boss.maxHp * (config.successHealRatio || 0.523));
            const shieldRatio = config.successShieldRatio ?? 0.523;
            if (shieldRatio > 0 && boss && !boss.dead) {
                const shieldGain = boss.maxHp * shieldRatio;
                boss.shield = (boss.shield || 0) + shieldGain;
                floatText(`보호막 +${Math.round(shieldGain)}`, boss.x, boss.y - battle.ballSize / 2, "#38bdf8");
            }
            if (window.nondurungField) {
                window.nondurungField(battle.arenaSize / 2, battle.arenaSize / 2, battle.arenaSize, stunSeconds);
            } else {
                screenFlash("#a3e635");
                effectRing(battle.arenaSize / 2, battle.arenaSize / 2, battle.arenaSize, "#84cc16");
            }
            floatText("논두렁!", boss.x, boss.y - battle.ballSize, "#84cc16");
            megaBurst(boss.x, boss.y, "#84cc16", 12);
        }

        function triggerPiagetFail(boss, now, config) {
            stun(boss, config.failStunSeconds || 5, now);
            battle.fighters.forEach((fighter) => {
                if (fighter.dead || fighter.isBoss || fighter.isMapObject || fighter.team !== "party") {
                    return;
                }
                healFighter(fighter, fighter.maxHp * (config.failPartyHealRatio || 0.2));
                fighter.damageMultiplier = (fighter.damageMultiplier || 1) * (1 + (config.failPartyDamageBoost || 0.523));
            });
            floatText("국정원 연행!", boss.x, boss.y - battle.ballSize, "#ef4444");
            megaBurst(boss.x, boss.y, "#ef4444", 10);
            screenFlash("#7f1d1d");
        }

        function updateRohMapEffects(now) {
            if (!isBossBattle) {
                return;
            }

            const boss = battle.fighters.find((fighter) => fighter.isBoss && fighter.definition.id === "roh-moohyun" && !fighter.dead);
            if (!boss) {
                return;
            }

            const mapEffects = boss.definition.mapEffects || {};
            const piagetConfig = mapEffects.piaget;
            if (piagetConfig && now >= (battle.nextPiagetAt || Infinity)) {
                const existing = battle.fighters.find((fighter) => !fighter.dead && fighter.mapObjectKind === "piaget");
                if (existing && !existing.mapResolved) {
                    existing.mapResolved = true;
                    floatText("피아제 미파괴", existing.x, existing.y, "#ef4444");
                    triggerPiagetFail(boss, now, piagetConfig);
                    despawnMapObject(existing);
                }
                spawnRohPiaget(boss, now, piagetConfig);
                battle.nextPiagetAt = now + (piagetConfig.interval || 30) * 1000;
            }

            battle.fighters.forEach((fighter) => {
                if (!fighter.isMapObject || fighter.dead || fighter.mapResolved) {
                    return;
                }
                if (fighter.mapObjectKind === "mic" && fighter.mapExpireAt > 0 && now >= fighter.mapExpireAt) {
                    fighter.mapResolved = true;
                    const micConfig = mapEffects.mic || {};
                    healFighter(boss, boss.maxHp * (micConfig.failHealRatio || 0.0523));
                    floatText("방송 성공 회복", boss.x, boss.y - battle.ballSize / 2, boss.definition.color);
                    megaBurst(fighter.x, fighter.y, boss.definition.color, 6);
                    despawnMapObject(fighter);
                }
            });
        }

        function fireRock(source, now, effects = {}) {
            if (!battle.activeRocks) {
                battle.activeRocks = [];
            }

            const direction = normalize(source.vx || 1, source.vy || 0);
            const element = document.createElement("div");
            element.className = "rock-projectile";
            element.textContent = "🪨";
            arena.appendChild(element);

            const rock = {
                source,
                x: source.x + direction.x * battle.ballSize * 0.55,
                y: source.y + direction.y * battle.ballSize * 0.55,
                vx: direction.x * scaledSpeed(effects.rockSpeed || 380),
                vy: direction.y * scaledSpeed(effects.rockSpeed || 380),
                radius: effects.rockRadius || 34,
                damage: effects.rockDamage || source.attack || 20,
                stunSeconds: effects.stunSeconds || 2,
                traveled: 0,
                maxRange: (effects.rockRange || 320) * arenaScale(),
                hits: new Set(),
                element
            };
            rock.element.style.left = `${rock.x}px`;
            rock.element.style.top = `${rock.y}px`;
            battle.activeRocks.push(rock);
            floatText("바위!", source.x, source.y - battle.ballSize / 2, source.definition.color);
            if (window.rockDropTrail) {
                window.rockDropTrail(source.x, source.y, direction.x, direction.y, source.definition.color);
            }
        }

        function updateRocks(dt, now) {
            if (!battle.activeRocks || battle.activeRocks.length === 0) {
                return;
            }

            battle.activeRocks = battle.activeRocks.filter((rock) => {
                const stepX = rock.vx * dt;
                const stepY = rock.vy * dt;
                rock.x += stepX;
                rock.y += stepY;
                rock.traveled += Math.hypot(stepX, stepY);
                rock.element.style.left = `${rock.x}px`;
                rock.element.style.top = `${rock.y}px`;

                let alive = rock.traveled < rock.maxRange
                    && rock.x > -40
                    && rock.y > -40
                    && rock.x < battle.arenaSize + 40
                    && rock.y < battle.arenaSize + 40
                    && rock.source
                    && !rock.source.dead;

                if (!alive) {
                    rock.element.remove();
                    return false;
                }

                battle.fighters.forEach((target) => {
                    if (!alive
                        || target.dead
                        || target === rock.source
                        || target.isMapObject
                        || target.offMapUntil > now
                        || areAllies(rock.source, target)
                        || rock.hits.has(target.id)) {
                        return;
                    }

                    const distance = Math.hypot(target.x - rock.x, target.y - rock.y);
                    if (distance <= rock.radius + fighterRadius(target)) {
                        rock.hits.add(target.id);
                        applyDamage(target, rock.damage, rock.source, "skill");
                        stun(target, rock.stunSeconds, now);
                        target.element.classList.add("gravity-crush");
                        setTimeout(() => target.element.classList.remove("gravity-crush"), (rock.stunSeconds || 2) * 1000);
                        impactStar(target.x, target.y, "#78716c");
                        floatText("중력 기절", target.x, target.y - battle.ballSize / 2, "#78716c");
                        megaBurst(target.x, target.y, "#a8a29e", 5);
                    }
                });

                if (rock.hits.size > 0 && rock.traveled > rock.maxRange * 0.35) {
                    // 한 번 이상 맞춘 뒤 조금 더 날아가다 소멸
                }

                return true;
            });
        }

        function updateSummons(dt) {
            const despawnQueue = [];
            let hudNeedsRefresh = false;
            battle.fighters.forEach((fighter) => {
                if (!fighter.isSummon || fighter.dead) {
                    return;
                }

                const owner = getFighterById(fighter.ownerId);
                if (!owner || owner.dead) {
                    fighter.hp = 0;
                } else if (!fighter.isMapObject) {
                    fighter.hp -= (fighter.definition.hpDecayPerSecond || 0) * dt;
                }

                if (fighter.hp <= 0) {
                    const deathX = fighter.x;
                    const deathY = fighter.y;
                    fighter.dead = true;
                    fighter.vx = 0;
                    fighter.vy = 0;
                    if (fighter.isMapObject) {
                        fighter.mapResolved = true;
                        floatText("소멸", deathX, deathY - battle.ballSize / 2, fighter.definition.color);
                        despawnQueue.push(fighter);
                    } else if (shouldDespawnOnDeath(fighter)) {
                        floatText("소멸", deathX, deathY - battle.ballSize / 2, fighter.definition.color);
                        despawnQueue.push(fighter);
                        hudNeedsRefresh = true;
                    } else {
                        floatText("퇴근", deathX, deathY - battle.ballSize / 2, fighter.definition.color);
                    }
                }
            });
            if (despawnQueue.length > 0) {
                despawnQueue.forEach((fighter) => removeFighterCompletely(fighter));
            }
            if (hudNeedsRefresh) {
                renderHud();
            }
        }

        function updateFollowSkill(fighter, now) {
            if (!fighter.followUntil || fighter.followUntil <= now) {
                fighter.followTargetId = null;
                fighter.followEffects = null;
                fighter.followCharmedBy = null;
                return false;
            }

            const target = getFighterById(fighter.followTargetId);
            if (!target || target.dead || target.offMapUntil > now || areAllies(fighter, target)) {
                fighter.followTargetId = null;
                fighter.followUntil = 0;
                fighter.followEffects = null;
                fighter.followCharmedBy = null;
                return false;
            }

            const effects = fighter.followEffects || fighter.definition.skill.effects || {};
            const direction = normalize(target.x - fighter.x, target.y - fighter.y);
            fighter.vx = direction.x * scaledSpeed(fighter.speed * (effects.followSpeedMultiplier || 1));
            fighter.vy = direction.y * scaledSpeed(fighter.speed * (effects.followSpeedMultiplier || 1));

            if (now >= fighter.nextFollowDamageAt) {
                const originalCharmedBy = fighter.charmedBy;
                if (fighter.followCharmedBy) fighter.charmedBy = fighter.followCharmedBy;

                applyDamage(target, (effects.damagePerSecond || 0) * (effects.tickInterval || 1), fighter, "skill");

                fighter.charmedBy = originalCharmedBy;
                fighter.nextFollowDamageAt = now + (effects.tickInterval || 1) * 1000;
            }

            return true;
        }

        function useSkill(fighter, now, skillIndex = 0) {
            characterModules.useSkill(fighter, now, skillIndex);
        }

        function handleWallBounce(fighter) {
            const radius = fighterRadius(fighter);
            let bounced = false;
            const now = performance.now();

            if (fighter.x < radius) {
                fighter.x = radius;
                fighter.vx = Math.abs(fighter.vx);
                bounced = true;
            } else if (fighter.x > battle.arenaSize - radius) {
                fighter.x = battle.arenaSize - radius;
                fighter.vx = -Math.abs(fighter.vx);
                bounced = true;
            }

            if (fighter.y < radius) {
                fighter.y = radius;
                fighter.vy = Math.abs(fighter.vy);
                bounced = true;
            } else if (fighter.y > battle.arenaSize - radius) {
                fighter.y = battle.arenaSize - radius;
                fighter.vy = -Math.abs(fighter.vy);
                bounced = true;
            }

            if (bounced) {
                const chargeEffects = fighter.definition.id === "lee-woochan" && fighter.chargeUntil > now
                    ? fighter.definition.skill.effects
                    : null;
                const bounceSpeed = chargeEffects
                    ? Math.max(chargeEffects.minSpeed, moveSpeedOf(fighter, now) * chargeEffects.speedMultiplier)
                    : moveSpeedOf(fighter, now);
                jitterVelocity(fighter, (Math.random() - 0.5) * 0.75, bounceSpeed);
                effectRing(fighter.x, fighter.y, battle.ballSize * 0.8, fighter.definition.color);
            }
        }

        function handleBasicAttack(attacker, defender, now) {
            if (attacker.dead || defender.dead || areAllies(attacker, defender) || isStunned(attacker, now) || attacker.definition.contactAttackDisabled) {
                return;
            }

            const piercesBasicIgnore = characterModules.piercesBasicIgnore(attacker, defender);
            const attackAmount = piercesBasicIgnore ? attacker.definition.baseAttack : attacker.attack;
            const basicBonusDamage = characterModules.basicBonusDamage(attacker, defender);
            const dealt = applyDamage(defender, attackAmount, attacker, "basic");
            if (dealt > 0) {
                let totalDealt = dealt;
                if (basicBonusDamage > 0 && !defender.dead) {
                    totalDealt += applyDamage(defender, basicBonusDamage, attacker, "passive");
                }
                characterModules.onBasicHit(attacker, defender, totalDealt, now);
                if (attacker.definition.id !== "faker") {
                    reduceCooldown(attacker, attacker.definition.cooldownOnBasicHit);
                }
            }
        }

        function handleChargeHit(charger, target, normalX, normalY) {
            const now = performance.now();
            if (charger.chargeUntil <= now || charger.chargeHits.has(target.id) || charger.dead || target.dead || areAllies(charger, target)) {
                return;
            }

            charger.chargeHits.add(target.id);
            const effects = charger.definition.skill.effects;
            applyDamage(target, effects.damage, charger, "skill");
            if (target.definition.immuneToKnockback) {
                floatText("NO PUSH", target.x, target.y, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.15, target.definition.color);
            } else if (!isStunned(target, now)) {
                target.vx = normalX * scaledSpeed(effects.knockback);
                target.vy = normalY * scaledSpeed(effects.knockback);
            }
            burst(target.x, target.y, charger.definition.color, 16);
            effectRing(target.x, target.y, battle.ballSize * 1.3, charger.definition.color);
        }

        function handleCollisions(now) {
            for (let first = 0; first < battle.fighters.length; first += 1) {
                for (let second = first + 1; second < battle.fighters.length; second += 1) {
                    const a = battle.fighters[first];
                    const b = battle.fighters[second];
                    if (a.dead || b.dead || a.offMapUntil > now || b.offMapUntil > now) {
                        continue;
                    }

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                    const minDistance = fighterRadius(a) + fighterRadius(b);

                    if (distance > minDistance) {
                        continue;
                    }

                    const nx = dx / distance;
                    const ny = dy / distance;
                    const overlap = minDistance - distance;
                    const noPushPair = a.definition.noPushCollision || b.definition.noPushCollision;
                    const bossPhasesStunned = (a.isBoss && isStunned(b, now)) || (b.isBoss && isStunned(a, now));
                    const tangentX = -ny;
                    const tangentY = nx;
                    const randomSide = Math.random() < 0.5 ? -1 : 1;

                    if (bossPhasesStunned) {
                        // The boss keeps its trajectory through stunned raid members.
                    } else if (a.isMapObject || b.isMapObject) {
                        // 맵 오브젝트는 고정, 상대만 밀어냄
                        if (a.isMapObject && !isStunned(b, now)) {
                            b.x += nx * (overlap + 1);
                            b.y += ny * (overlap + 1);
                        } else if (b.isMapObject && !isStunned(a, now)) {
                            a.x -= nx * (overlap + 1);
                            a.y -= ny * (overlap + 1);
                        }
                    } else if (noPushPair) {
                        if (a.definition.noPushCollision && !isStunned(a, now)) {
                            a.x -= nx * overlap;
                            a.y -= ny * overlap;
                        } else if (b.definition.noPushCollision && !isStunned(b, now)) {
                            b.x += nx * overlap;
                            b.y += ny * overlap;
                        }
                    } else {
                        const separation = overlap * 0.58 + 0.8;
                        if (!isStunned(a, now)) {
                            a.x -= nx * separation;
                            a.y -= ny * separation;
                        }
                        if (!isStunned(b, now)) {
                            b.x += nx * separation;
                            b.y += ny * separation;
                        }
                    }

                    const aVelocity = a.vx * nx + a.vy * ny;
                    const bVelocity = b.vx * nx + b.vy * ny;
                    const impulse = bVelocity - aVelocity;

                    if (!noPushPair && !bossPhasesStunned && !isStunned(a, now)) {
                        a.vx += impulse * nx + tangentX * randomSide * scaledSpeed(18);
                        a.vy += impulse * ny + tangentY * randomSide * scaledSpeed(18);
                    }
                    if (!noPushPair && !bossPhasesStunned && !isStunned(b, now)) {
                        b.vx -= impulse * nx + tangentX * randomSide * scaledSpeed(18);
                        b.vy -= impulse * ny + tangentY * randomSide * scaledSpeed(18);
                    }

                    if (!noPushPair && !bossPhasesStunned) {
                        const aCharge = a.definition.skill.effects || {};
                        const bCharge = b.definition.skill.effects || {};
                        setVelocitySpeed(a, a.chargeUntil > now ? Math.max(aCharge.minSpeed, moveSpeedOf(a, now) * aCharge.speedMultiplier) : moveSpeedOf(a, now));
                        setVelocitySpeed(b, b.chargeUntil > now ? Math.max(bCharge.minSpeed, moveSpeedOf(b, now) * bCharge.speedMultiplier) : moveSpeedOf(b, now));
                        jitterVelocity(a, (Math.random() - 0.5) * 0.28, moveSpeedOf(a, now));
                        jitterVelocity(b, (Math.random() - 0.5) * 0.28, moveSpeedOf(b, now));
                        effectRing((a.x + b.x) / 2, (a.y + b.y) / 2, battle.ballSize * 1.15, "#1c1b1b");
                        if (now - (battle.lastImpactAt || 0) > 90) {
                            battle.lastImpactAt = now;
                            impactStar((a.x + b.x) / 2, (a.y + b.y) / 2, "#facc15");
                        }
                    }

                    handleChargeHit(a, b, nx, ny);
                    handleChargeHit(b, a, -nx, -ny);

                    if (!areAllies(a, b)) {
                        characterModules.onEnemyCollision(a, b, now);
                        characterModules.onEnemyCollision(b, a, now);
                    }

                    const key = `${a.id}:${b.id}`;
                    const lastHit = battle.pairHits.get(key) || 0;
                    if (now - lastHit > 620) {
                        battle.pairHits.set(key, now);
                        handleBasicAttack(a, b, now);
                        handleBasicAttack(b, a, now);
                        burst((a.x + b.x) / 2, (a.y + b.y) / 2, "#1c1b1b", 5);
                    }
                }
            }
        }

        function updatePhysics(dt, now) {
            updateSummons(dt);
            updateBombs(now);

            battle.fighters.forEach((fighter) => {
                sanitizeFighterState(fighter);
                if (fighter.dead) {
                    return;
                }

                updateBbangkiCrash(fighter, now);
                if (fighter.dead) {
                    return;
                }

                if (updateSwallowed(fighter, now)) {
                    return;
                }

                resolveBackstab(fighter, now);
                restoreFromOffMap(fighter, now);

                if (fighter.offMapUntil > now) {
                    return;
                }

                restoreFromStun(fighter, now);

                if (updateCenterLock(fighter, now)) {
                    return;
                }
                if (fighter.dead) {
                    return;
                }

                if (isStunned(fighter, now)) {
                    return;
                }

                updateRangedAttacks(fighter, now);

                if (!fighter.isMapObject) {
                    const skills = getSkills(fighter.definition);
                    const cooldowns = ensureSkillCooldowns(fighter);
                    for (let i = 0; i < skills.length; i += 1) {
                        cooldowns[i] = (cooldowns[i] ?? skillCooldownDuration(fighter, i)) - dt;
                        if (cooldowns[i] <= 0) {
                            useSkill(fighter, now, i);
                        }
                    }
                    fighter.skillCooldown = cooldowns[0] ?? fighter.skillCooldown;
                }

                if (updateCenterLock(fighter, now)) {
                    return;
                }
                if (fighter.dead) {
                    return;
                }

                if (fighter.isMapObject || fighter.definition.immobile) {
                    fighter.vx = 0;
                    fighter.vy = 0;
                } else if (fighter.chargeUntil > now) {
                    if (Math.random() < 0.18 * performanceProfile.effectScale) {
                        chargeGhost(fighter);
                    }
                    if (Math.random() < 0.08 * performanceProfile.effectScale) {
                        burst(fighter.x, fighter.y, fighter.definition.color, 2);
                    }
                } else if (updateFollowSkill(fighter, now)) {
                    // Follow skill controls movement while active.
                } else if (fighter.definition.movementPattern === "corners") {
                    steerToCorner(fighter, dt, now);
                } else {
                    maintainMotion(fighter, now);
                }

                if (!fighter.isMapObject && !fighter.definition.immobile) {
                    fighter.x += fighter.vx * dt;
                    fighter.y += fighter.vy * dt;
                    handleWallBounce(fighter);
                }
            });

            handleCollisions(now);
            battle.fighters.forEach((fighter) => {
                if (!fighter.dead && fighter.offMapUntil <= now && !fighter.isMapObject) {
                    handleWallBounce(fighter);
                }
            });
            updateRocks(dt, now);
            updateRohMapEffects(now);
            updatePuddles(now);
            updatePoisons(now);
            updateTaehoonPoisons(now);
            updateIceZones(now);
            updateFlowerZones(now);
            updateWorldsTrophies(now);
        }

        function checkWinner(now) {
            const alive = battle.fighters.filter((fighter) => !fighter.dead && !fighter.isSummon);
            const boss = alive.find((fighter) => fighter.isBoss);
            const partyAlive = alive.filter((fighter) => fighter.team === "party");
            const raidFinished = isBossBattle && (!boss || partyAlive.length === 0);
            if (!battle.isFinished && battle.isRunning && (raidFinished || (!isBossBattle && alive.length <= 1))) {
                battle.isFinished = true;
                battle.isRunning = false;
                battle.finishedAt = now;

                let resultTitle = isBossBattle
                    ? (boss ? "보스 승리" : "레이드 성공!")
                    : (alive[0] ? `${escapeHtml(alive[0].definition.name)} 승리` : "무승부");
                let unlockNote = "";

                if (isBossBattle && !boss) {
                    const defeatedBoss = battle.fighters.find((fighter) => fighter.isBoss);
                    if (defeatedBoss) {
                        const clearedBefore = window.HannamBalls.getClearedBosses();
                        window.HannamBalls.markBossCleared(defeatedBoss.definition.id);
                        if (defeatedBoss.definition.id === "faker" && !clearedBefore.includes("faker")) {
                            unlockNote = `<div class="font-label-numeric text-label-numeric mt-2 text-primary">노무현 보스전 해금!</div>`;
                            resultTitle = "레이드 성공! 노무현 해금";
                        }
                    }
                }

                countdown.classList.remove("hidden");
                countdown.innerHTML = `
                    <div>
                        <div>${resultTitle}</div>
                        ${unlockNote}
                        <div class="font-label-numeric text-label-numeric mt-3">TIME ${formatElapsed(currentFightElapsed(now))}</div>
                    </div>
                `;
                matchTitle.textContent = isBossBattle ? "보스전 종료" : "전투 종료";
                updateElapsed(now);
            }
        }

        function tick(now) {
            if (!battle.lastTime) {
                battle.lastTime = now;
            }

            const elapsed = now - battle.startedAt;
            const remaining = Math.ceil((battle.countdownSeconds * 1000 - elapsed) / 1000);

            if (!battle.isRunning && !battle.isFinished) {
                const countdownText = remaining > 0 ? String(remaining) : "FIGHT";
                if (countdown.textContent !== countdownText) {
                    countdown.textContent = countdownText;
                }
                if (elapsed >= battle.countdownSeconds * 1000) {
                    battle.isRunning = true;
                    battle.fightStartedAt = now;
                    countdown.classList.add("hidden");
                    matchTitle.textContent = seungchanArmyActive
                        ? "승찬군단 출격"
                        : (isBossBattle ? "보스 레이드 중" : "전투 중");
                    if (seungchanArmyActive) {
                        const firstSeungchan = battle.fighters.find((fighter) => fighter.definition.id === "yoo-seungchan" && !fighter.isBoss);
                        if (firstSeungchan) {
                            floatText("승찬군단 x27 OP", firstSeungchan.x, firstSeungchan.y - battle.ballSize, "#7b7f86");
                            megaBurst(firstSeungchan.x, firstSeungchan.y, "#7b7f86", 16);
                            screenFlash("#7b7f86");
                        }
                    }
                }
            }

            const dt = Math.min(0.033, (now - battle.lastTime) / 1000);
            battle.lastTime = now;

            if (battle.isRunning) {
                updatePhysics(dt, now);
                checkWinner(now);
            }

            renderFighters(now);
            if (hudUpdateGate.shouldRun(now) || battle.isFinished) {
                updateHud(now);
            }
            if (elapsedUpdateGate.shouldRun(now) || battle.isFinished) {
                updateElapsed(now);
            }

            if (battle.isRunning || !battle.isFinished) {
                animationFrameId = requestAnimationFrame(tick);
            } else {
                animationFrameId = null;
            }
        }

        function skillDescriptionsHtml(definition) {
            const skills = getSkills(definition);
            return skills.map((skill, index) => `
                <div class="bg-surface-container-low brutal-border-thin p-2">
                    <p class="font-label-numeric text-label-numeric text-secondary">스킬${skills.length > 1 ? index + 1 : ""}: ${escapeHtml(skill.name)} / ${skill.cooldown}초</p>
                    <p class="text-on-surface-variant mt-1">${escapeHtml(skill.description)}</p>
                </div>
            `).join("");
        }

        function mapEffectsHtml(definition) {
            if (!definition.mapEffects) {
                return "";
            }
            const mic = definition.mapEffects.mic;
            const piaget = definition.mapEffects.piaget;
            const trophy = definition.mapEffects.trophy;
            const lines = [];
            if (mic) {
                lines.push(`<p class="text-on-surface-variant">마이크: 최대 체력의 ${(mic.damageThresholdRatio * 100).toFixed(2)}% 피해마다 HP ${mic.maxHp} 마이크 소환. ${mic.lifetime}초 내 파괴 시 아군 공격력 +${(mic.successAttackBuffRatio * 100).toFixed(2)}%, 실패 시 보스 최대 체력 ${(mic.failHealRatio * 100).toFixed(2)}% 회복.</p>`);
            }
            if (piaget) {
                const shieldRatio = piaget.successShieldRatio ?? 0.523;
                lines.push(`<p class="text-on-surface-variant">피아제: ${piaget.interval}초마다 HP ${piaget.maxHp} 피아제 소환. 보스가 파괴 시 논두렁 ${piaget.successStunSeconds}초·보스 최대 체력 ${(piaget.successHealRatio * 100).toFixed(1)}% 회복·보호막 ${(shieldRatio * 100).toFixed(1)}%. 실패 시 보스 ${piaget.failStunSeconds}초 행동 불가·아군 최대 체력 ${(piaget.failPartyHealRatio * 100).toFixed(0)}% 회복·피해 +${(piaget.failPartyDamageBoost * 100).toFixed(1)}%.</p>`);
            }
            if (trophy) {
                lines.push(`<p class="text-on-surface-variant">${escapeHtml(trophy.name || "월즈 트로피")}: ${escapeHtml(trophy.description)}</p>`);
            }
            if (!lines.length) {
                return "";
            }
            return `
                <div class="bg-secondary-fixed brutal-border-thin p-2 space-y-2">
                    <p class="font-label-numeric text-label-numeric text-on-secondary-fixed">맵 특수효과</p>
                    ${lines.join("")}
                </div>
            `;
        }

        function raidBalanceHtml(definition) {
            if (!isBossBattle || !window.HannamBalls?.getRaidBalanceInfo) {
                return "";
            }
            if (definition?.isSummonDefinition || definition?.isMapObject) {
                return "";
            }
            const partyCount = battle.fighters.filter((fighter) => (
                fighter.team === "party" && !fighter.isSummon && !fighter.isMapObject
            )).length || Math.max(selectedCharacters.filter((item) => item.raidRole === "party" || item.category !== "boss").length, 2);
            const boss = battle.fighters.find((fighter) => fighter.isBoss)
                || selectedCharacters.find((item) => item.category === "boss" || item.raidRole === "boss");
            const info = window.HannamBalls.getRaidBalanceInfo(definition, {
                partyCount: Math.max(partyCount, 1),
                bossId: boss?.definition?.id || boss?.id || "faker"
            });
            if (!info?.lines?.length) {
                return "";
            }
            return `
                <div class="bg-primary-fixed brutal-border-thin p-2 space-y-1">
                    <p class="font-label-numeric text-label-numeric text-on-primary-fixed">보스전 밸런스</p>
                    ${info.lines.map((line) => `<p class="text-sm text-on-surface-variant">${escapeHtml(line)}</p>`).join("")}
                </div>
            `;
        }

        function showInfo(definition) {
            const skills = getSkills(definition);
            const base = window.HannamBalls.getCharacter(definition.id);
            const raidInfo = isBossBattle && base && window.HannamBalls?.getRaidBalanceInfo
                ? window.HannamBalls.getRaidBalanceInfo(base, {
                    partyCount: Math.max(
                        battle.fighters.filter((fighter) => fighter.team === "party" && !fighter.isSummon && !fighter.isMapObject).length,
                        2
                    ),
                    bossId: (battle.fighters.find((fighter) => fighter.isBoss)?.definition?.id)
                        || selectedCharacters.find((item) => item.category === "boss" || item.raidRole === "boss")?.id
                        || "faker"
                })
                : null;
            const hpLabel = raidInfo && !raidInfo.isBoss && raidInfo.raidMaxHp !== raidInfo.baseMaxHp
                ? `HP ${definition.maxHp} <span class="opacity-70">(기본 ${raidInfo.baseMaxHp})</span>`
                : `HP ${definition.maxHp}`;
            document.getElementById("modal-name").textContent = definition.name;
            document.getElementById("modal-name").style.color = definition.color;
            document.getElementById("modal-skill").textContent = skills.map((skill) => `${skill.name} / ${skill.cooldown}초`).join(" · ");
            document.getElementById("modal-body").innerHTML = `
                <div class="grid grid-cols-2 gap-2 font-label-numeric text-label-numeric">
                    <div class="bg-surface-container-low brutal-border-thin p-2">${hpLabel}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">ATK ${definition.baseAttack}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">SPD ${escapeHtml(definition.speedLabel)}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">${escapeHtml(definition.colorName)}</div>
                </div>
                ${raidBalanceHtml(definition)}
                ${passiveHtml(definition)}
                ${skillDescriptionsHtml(definition)}
                ${mapEffectsHtml(definition)}
                <p class="font-label-numeric text-label-numeric">특성: ${escapeHtml(definition.traits.join(" / "))}</p>
                ${definition.immuneToBasic ? '<p class="font-label-numeric text-label-numeric text-secondary">기본 공격 피해 면역</p>' : ''}
                ${definition.immuneToKnockback ? '<p class="font-label-numeric text-label-numeric text-secondary">밀치기 면역</p>' : ''}
            `;
            document.getElementById("info-modal").classList.remove("hidden");
            document.getElementById("info-modal").classList.add("flex");
        }

        function hideInfo() {
            document.getElementById("info-modal").classList.add("hidden");
            document.getElementById("info-modal").classList.remove("flex");
        }

        function computeRaidIncomingDamageMultiplier(partyCount, bossId) {
            return window.HannamBalls.computeRaidIncomingDamageMultiplier(partyCount, bossId);
        }

        function startBattle() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            arena.querySelectorAll(".fighter-ball, .effect-ring, .effect-burst, .damage-float, .skill-label, .bomb-timer, .impact-star, .puddle-zone, .flower-zone, .poison-field, .ice-field, .arena-flash, .worlds-trophy, .diet-aura, .ground-shockwave, .ground-crack, .ice-crystal, .frost-ring, .charge-ghost, .speed-line, .poison-drop, .poison-mist-cloud, .summon-portal, .summon-sparkle, .heart-particle, .glitch-line, .glitch-block, .cloud-particle, .slow-spiral, .siren-light, .arrest-net, .stealth-ghost, .blade-flash, .dust-puff, .bomb-pulse-ring, .explosion-ember, .explosion-flash-ring, .rock-projectile, .nondurung-field").forEach((node) => node.remove());
            battle.fighters = selectedCharacters.map((definition, index) => createFighter(definition, index, selectedCharacters.length));
            if (isBossBattle) {
                const partyCount = battle.fighters.filter((fighter) => fighter.team === "party" && !fighter.isSummon).length;
                const boss = battle.fighters.find((fighter) => fighter.isBoss);
                if (boss) {
                    // 인원 보정 피벗 10명:
                    // - 10인 미만: 보스 받는 피해 증가 (적을수록 대폭)
                    // - 10인: 보정 없음
                    // - 10인 초과: 보스 받는 피해 소폭 감소 (많을수록 천천히 감소)
                    boss.raidIncomingDamageMultiplier = computeRaidIncomingDamageMultiplier(partyCount, boss.definition.id);
                    const extraRaiders = Math.max(0, partyCount - 2);
                    const ccFloor = boss.definition.id === "roh-moohyun" ? 0.38 : 0.45;
                    const ccScale = boss.definition.id === "roh-moohyun" ? 0.1 : 0.08;
                    boss.raidCcDurationMultiplier = Math.max(ccFloor, 1 / (1 + extraRaiders * ccScale));
                    if (boss.definition.id === "roh-moohyun") {
                        boss.rohMicSegmentsClaimed = 0;
                        // 오프닝 압박: 첫 스킬을 빨리 돌림
                        ensureSkillCooldowns(boss);
                        boss.skillCooldowns[0] = 5.23;
                        if (boss.skillCooldowns.length > 1) {
                            boss.skillCooldowns[1] = 5.23;
                        }
                        boss.skillCooldown = boss.skillCooldowns[0];
                    }
                }
            }
            battle.pairHits = new Map();
            battle.activePuddles = [];
            battle.activePoisons = [];
            battle.activeBombs = [];
            battle.activeIceZones = [];
            battle.activeFlowerZones = [];
            battle.activeTrophies = [];
            battle.activeRocks = [];

            activeEffects.rings = 0;
            activeEffects.stars = 0;
            activeEffects.bursts = 0;
            activeEffects.floatTexts = 0;
            activeEffects.flashes = 0;
            activeEffects.skillLabels = 0;

            battle.startedAt = performance.now();
            const fightStartAt = battle.startedAt + battle.countdownSeconds * 1000;
            const fakerBoss = isBossBattle && battle.fighters.some((fighter) => fighter.isBoss && fighter.definition.id === "faker");
            battle.nextTrophyAt = fakerBoss ? fightStartAt + 6000 : Infinity;
            const rohBoss = battle.fighters.find((fighter) => fighter.isBoss && fighter.definition.id === "roh-moohyun");
            // 첫 피아제는 전투 시작 직후 등장해 초반 템포를 올림
            battle.nextPiagetAt = rohBoss
                ? fightStartAt + 5.23 * 1000
                : Infinity;
            battle.fightStartedAt = 0;
            battle.finishedAt = 0;
            battle.lastTime = 0;
            battle.isRunning = false;
            battle.isFinished = false;
            countdown.classList.remove("hidden");
            countdown.textContent = "3";
            matchTitle.textContent = isBossBattle ? "보스전 준비" : "전투 준비";

            lastElapsedText = "";
            elapsedTime.textContent = "TIME 00:00.0";
            hudUpdateGate.reset();
            elapsedUpdateGate.reset();

            layoutFighters();
            renderHud();
            renderFighters(performance.now());

            animationFrameId = requestAnimationFrame(tick);
        }

        document.getElementById("restart-button").addEventListener("click", startBattle);
        document.getElementById("modal-close").addEventListener("click", hideInfo);
        document.getElementById("info-modal").addEventListener("click", (event) => {
            if (event.target.id === "info-modal") {
                hideInfo();
            }
        });
        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                hideInfo();
            }
        });

        window.addEventListener("resize", () => {
            if (!battle.fighters.length) {
                return;
            }
            const oldSize = battle.arenaSize || 1;
            const rect = arena.getBoundingClientRect();
            const ratio = rect.width / oldSize;
            battle.arenaSize = rect.width;
            battle.ballSize = Math.max(54, Math.min(82, battle.arenaSize * 0.14));
            updateCachedCorners();
            battle.fighters.forEach((fighter) => {
                fighter.x *= ratio;
                fighter.y *= ratio;
                if (!fighter.element) {
                    return;
                }
                const size = battle.ballSize * (fighter.isBoss ? 2 : 1);
                fighter.element.style.width = `${size}px`;
                fighter.element.style.height = `${size}px`;
            });
        });

        startBattle();
    </script>
</body>

</html>
