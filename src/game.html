<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>한남볼파이트 전투</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./characters.js"></script>
    <link href="./effects.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@700&amp;family=Inter:wght@500&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#006d36",
                        "on-secondary-container": "#fffbff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#f0dbff",

                        "surface-container-highest": "#e5e2e1",
                        "on-primary-fixed-variant": "#005227",

                        "on-secondary-fixed": "#2c0051",
                        "surface-bright": "#fcf9f8",

                        "secondary": "#8127cf",
                        "primary-fixed": "#6dfe9c",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "surface-variant": "#e5e2e1",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-primary-fixed": "#00210c",
                        "on-tertiary-fixed-variant": "#004395",
                        "tertiary-fixed": "#d8e2ff",
                        "inverse-primary": "#4de082",
                        "outline-variant": "#bccabb",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary-fixed": "#001a42",
                        "background": "#fcf9f8",
                        "secondary-container": "#9c48ea",
                        "surface": "#fcf9f8",
                        "inverse-surface": "#313030",
                        "primary-fixed-dim": "#4de082",
                        "surface-dim": "#dcd9d9",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#4ade80",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary-fixed-variant": "#6900b3",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#005e2d",
                        "surface-container": "#f0eded",
                        "on-surface": "#1c1b1b",
                        "outline": "#6d7b6d",

            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hard-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
        }

        .hard-shadow-sm {
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        }

        .brutal-border-thick {
            border: 4px solid #1c1b1b;
        }

        .brutal-border-thin {
            border: 2px solid #1c1b1b;
        }

        .btn-brutal {
            transition: all 0.1s ease;
        }

        .btn-brutal:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        }

        .fighter-ball {
            position: absolute;
            border-radius: 9999px;
            border: 4px solid #1c1b1b;
            box-shadow: 4px 4px 0px 0px #1c1b1b;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            user-select: none;
        }

        .fighter-ball.is-stunned::after {
            content: "!";
            position: absolute;
            inset: -4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.72);
            color: #ba1a1a;
            font: 800 42px "Plus Jakarta Sans", sans-serif;
        }

        .fighter-ball.is-dead {
            filter: grayscale(1);
            opacity: 0.35;
        }

        .fighter-ball.is-offmap {
            opacity: 0;
            transform: translate(-140px, -140px) !important;
        }

        .fighter-ball.has-shield {
            box-shadow: 0 0 0 6px #38bdf8, 4px 4px 0px 0px #1c1b1b;
        }

        .fighter-ball.is-map-object {
            border-style: dashed;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.55), 4px 4px 0 #1c1b1b;
        }

        .fighter-ball.gravity-crush {
            filter: brightness(0.72) saturate(0.55) contrast(1.1);
            outline: 5px solid #57534e;
            outline-offset: 2px;
        }

        .fighter-ball.taste-marked {
            outline: 7px dashed #fb923c;
            outline-offset: 4px;
            animation: taste-mark-pulse 0.7s steps(2, end) infinite;
        }

        .fighter-ball.is-boss {
            border-width: 7px;
            box-shadow: 0 0 0 7px #f59e0b, 8px 8px 0 #1c1b1b;
            z-index: 12;
        }

        .fighter-ball.gogeonpa-mode {
            outline: 9px double #ef4444;
            filter: saturate(1.5) contrast(1.15);
            animation: taste-mark-pulse 0.35s steps(2, end) infinite;
        }

        .worlds-trophy {
            position: absolute;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            border: 4px solid #1c1b1b;
            background: #facc15;
            box-shadow: 5px 5px 0 #1c1b1b, 0 0 20px #fef08a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9;
            pointer-events: none;
            animation: trophy-pulse 0.8s steps(2, end) infinite;
        }

        .worlds-trophy::after { content: "🏆"; font-size: 28px; }
        @keyframes trophy-pulse { 50% { transform: translate(-50%, -50%) scale(1.15) rotate(5deg); } }

        @keyframes taste-mark-pulse {
            50% { outline-color: #fef08a; outline-offset: 8px; }
        }

        .effect-ring,
        .effect-burst,
        .damage-float,
        .skill-label,
        .bomb-timer,
        .impact-star,
        .puddle-zone,
        .poison-field,
        .ice-field,
        .arena-flash {
            position: absolute;
            pointer-events: none;
            z-index: 20;
        }

        .effect-ring {
            border: 4px solid currentColor;
            border-radius: 9999px;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.65);
            animation: ring-pop 520ms ease-out forwards;
        }

        .effect-burst {
            width: 14px;
            height: 14px;
            background: currentColor;
            border: 2px solid #1c1b1b;
            box-shadow: 2px 2px 0px 0px #1c1b1b;
            animation: burst-pop 460ms ease-out forwards;
        }

        .damage-float {
            padding: 3px 6px;
            background: #ffffff;
            border: 2px solid #1c1b1b;
            box-shadow: 2px 2px 0px 0px #1c1b1b;
            font: 700 14px "JetBrains Mono", monospace;
            animation: damage-float 780ms ease-out forwards;
            white-space: nowrap;
        }

        .skill-label {
            padding: 4px 8px;
            background: #1c1b1b;
            color: #ffffff;
            border: 2px solid #ffffff;
            font: 700 13px "JetBrains Mono", monospace;
            animation: skill-label 720ms ease-out forwards;
            white-space: nowrap;
        }

        .bomb-timer {
            padding: 3px 7px;
            background: #1c1b1b;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 2px 2px 0px 0px #ba1a1a;
            font: 800 13px "JetBrains Mono", monospace;
            transform: translate(-50%, -115%);
            white-space: nowrap;
            z-index: 35;
        }

        .impact-star {
            width: 24px;
            height: 24px;
            background: currentColor;
            border: 3px solid #1c1b1b;
            clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 69%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
            animation: impact-star 520ms ease-out forwards;
        }

        .puddle-zone {
            border-radius: 9999px;
            border: 2px solid rgba(28, 27, 27, 0.75);
            background: rgba(139, 47, 35, 0.38);
            z-index: 3;
        }

        .poison-field {
            inset: 0;
            background: rgba(139, 47, 35, 0.24);
            border: 6px solid rgba(139, 47, 35, 0.75);
            z-index: 4;
        }

        .ice-field {
            background: rgba(56, 189, 248, 0.28);
            border: 5px solid rgba(2, 132, 199, 0.72);
            box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.72);
            z-index: 4;
        }

        .arena-flash {
            inset: 0;
            background: currentColor;
            opacity: 0.16;
            z-index: 25;
            animation: arena-flash 220ms ease-out forwards;
        }

        @keyframes ring-pop {
            from {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(0.25);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        @keyframes burst-pop {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.8);
            }

            to {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(90deg) scale(1.2);
            }
        }

        @keyframes damage-float {
            from {
                opacity: 1;
                transform: translate(-50%, -50%);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -84px);
            }
        }

        @keyframes skill-label {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.9);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -86px) scale(1.06);
            }
        }

        @keyframes impact-star {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.4);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(160deg) scale(2);
            }
        }

        @keyframes puddle-pulse {
            from {
                transform: translate(-50%, -50%) scale(0.94);
                opacity: 0.78;
            }

            to {
                transform: translate(-50%, -50%) scale(1.04);
                opacity: 0.48;
            }
        }

        @keyframes poison-throb {
            0% {
                opacity: 0.72;
            }

            100% {
                opacity: 0.36;
            }
        }

        @keyframes arena-flash {
            from {
                opacity: 0.28;
            }

            to {
                opacity: 0;
            }
        }

        .modal-backdrop {
            background: rgba(28, 27, 27, 0.54);
        }

        .hud-card {
            min-width: 0;
        }

        .hud-name,
        .status-text,
        .hp-text {
            overflow-wrap: anywhere;
        }

        .boss-health-banner {
            background: #1c1b1b;
            color: #ffffff;
            border: 4px solid #f59e0b;
            box-shadow: 7px 7px 0 #7c2d12;
        }

        .boss-health-track {
            height: 28px;
            border: 3px solid #ffffff;
            background: #3f3f46;
            overflow: hidden;
        }

        .boss-health-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #f59e0b);
            transition: width 0.15s linear;
        }

        .boss-cooldown-track {
            height: 12px;
            border: 2px solid #ffffff;
            background: #3f3f46;
            overflow: hidden;
        }

        .boss-cooldown-fill {
            height: 100%;
            background: #38bdf8;
            transition: width 0.1s linear, background-color 0.1s linear;
        }

        @media (max-width: 767px) {
            .hud-card {
                padding: 8px;
                background: #ffffff;
                border: 2px solid #1c1b1b;
                box-shadow: 2px 2px 0px 0px #1c1b1b;
            }

            .hud-name {
                font-size: 15px;
                line-height: 1.15;
            }

            .hp-text,
            .status-text {
                font-size: 11px;
                line-height: 1.15;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-base text-body-base min-h-screen flex flex-col pb-20 md:pb-0">
    <main class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 w-full max-w-6xl mx-auto">

            <a href="./index.html"

                선택

            <div class="text-center">

                    class="absolute inset-0 z-30 flex items-center justify-center bg-white/70 font-display-lg text-display-lg text-on-background text-center px-4">

            <div id="hud"

    <div id="info-modal" class="fixed inset-0 hidden items-center justify-center p-4 modal-backdrop z-50 overflow-y-auto">
        <div class="w-full max-w-md max-h-[min(90vh,900px)] bg-surface brutal-border-thick hard-shadow p-6 flex flex-col my-auto">

            <div id="modal-body" class="space-y-3 text-body-base overflow-y-auto min-h-0 flex-1 overscroll-contain pr-1"></div>

    <script src="./battle-core.js"></script>
    <script src="./battle-characters.js"></script>
    <script src="./effects.js"></script>
    <script>
        const arena = document.getElementById("arena");
        const hud = document.getElementById("hud");
        const countdown = document.getElementById("countdown");
        const matchTitle = document.getElementById("match-title");
        const elapsedTime = document.getElementById("elapsed-time");
        const bossHealthBanner = document.getElementById("boss-health-banner");
        const bossHealthName = document.getElementById("boss-health-name");
        const bossHealthText = document.getElementById("boss-health-text");
        const bossHealthFill = document.getElementById("boss-health-fill");
        const bossHealthStatus = document.getElementById("boss-health-status");
        const bossCooldownRows = Array.from(document.querySelectorAll("#boss-cooldown-rows .boss-cooldown-row"));
        const BattleCore = window.HannamBallsBattle;
        const performanceProfile = BattleCore.createPerformanceProfile();
        const allCharacters = window.HannamBalls.getCharacters();
        const battleMode = localStorage.getItem("hannamBallsBattleMode") === "boss" ? "boss" : "normal";
        const isBossBattle = battleMode === "boss";
        const storedSelection = JSON.parse(localStorage.getItem("hannamBallsSelection") || "[]");
        let selectedCharacters = storedSelection
            .map((id) => window.HannamBalls.getCharacter(id))
            .filter((character) => character && character.category !== "boss");

        function applyRaidBalance(definition) {
            definition.raidRole = "party";
            definition.maxHp = window.HannamBalls.getRaidMaxHp(definition.maxHp);
            if (definition.id === "song-geonuk" && definition.skill?.effects) {
                definition.skill.effects.attackGain *= window.HannamBalls.RAID_SONG_GEONUK_ATTACK_GAIN_MULTIPLIER;
            }
            if (definition.id === "kang-hyunwoo" && definition.passive?.effects) {
                definition.passive.effects.growthDamage *= window.HannamBalls.RAID_KANG_HYUNWOO_GROWTH_MULTIPLIER;
            }
            return definition;
        }

        // 이스터에그: 유승찬 27명 → 테스트용 초강 승찬군단
        const SEUNGCHAN_ARMY_COUNT = 27;
        let seungchanArmyActive = false;

        function applySeungchanArmyEasterEgg(definitions) {
            const seungchanCount = definitions.filter((definition) => (
                definition
                && definition.id === "yoo-seungchan"
                && definition.raidRole !== "boss"
                && definition.category !== "boss"
            )).length;

            seungchanArmyActive = seungchanCount >= SEUNGCHAN_ARMY_COUNT;
            if (!seungchanArmyActive) {
                return definitions;
            }

            return definitions.map((definition) => {
                if (definition.id !== "yoo-seungchan" || definition.raidRole === "boss" || definition.category === "boss") {
                    return definition;
                }

                definition.maxHp = 27090;
                definition.baseAttack = 2709;
                definition.speed = 523;
                definition.speedLabel = "승찬군단";
                definition.colorName = "군단 회색";
                definition.traits = ["승찬군단 OP", "테스트용", "쿨타임 삭제급", "근거리 맵 장악"];
                definition.startingDamageReduction = 0.523;
                definition.immuneToKnockback = true;
                definition.cooldownOnBasicHit = 2.709;
                definition.cooldownOnDamageTaken = 2.709;
                if (definition.skill) {
                    definition.skill.name = "군대 쿵쾅!";
                    definition.skill.cooldown = 0.523;
                    definition.skill.description = "승찬군단 이스터에그: 맵 절반을 강타해 2709 피해와 2.709초 기절을 겁니다.";
                    definition.skill.effects = {
                        ...(definition.skill.effects || {}),
                        damage: 2709,
                        stunSeconds: 2.709,
                        radius: 420
                    };
                }
                return definition;
            });
        }

        if (isBossBattle && selectedCharacters.length < 2) {
            selectedCharacters = allCharacters.filter((character) => character.category !== "boss").slice(0, 4);
        }

        if (isBossBattle) {
            selectedCharacters = selectedCharacters.map(applyRaidBalance);
            let bossId = localStorage.getItem("hannamBallsBossSelection") || "faker";
            if (!window.HannamBalls.isBossUnlocked(bossId)) {
                bossId = "faker";

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function normalize(x, y) {
            return BattleCore.normalize(x, y);
        }

        function arenaScale() {
            return Math.max(0.55, Math.min(1.05, battle.arenaSize / 600));
        }

        function scaledSpeed(speed) {
            return speed * arenaScale();
        }

        function moveSpeedOf(fighter, now = performance.now()) {
            if (fighter.definition.immobile && fighter.forceMoveUntil <= now) {
                return 0;
            }

            let speed = fighter.speed;
            if (fighter.gogeonpaUntil > now) {
                speed *= fighter.definition.skill.effects.gogeonpaSpeedMultiplier || 0.5;
            }
            if (fighter.slowUntil > now) {
                speed *= fighter.slowMultiplier;
            }
            if (fighter.hasteUntil > now) {
                speed *= fighter.hasteMultiplier;
            }
            return speed;
        }

        function getSkills(definition) {
            return BattleCore.getSkills(definition);
        }

        function skillCooldownDuration(fighter, skillIndex = 0) {
            const duration = BattleCore.skillCooldownDuration(fighter, skillIndex);
            if (fighter.definition.id === "faker" && skillIndex === 0) {
                return Math.max(5, duration - (fighter.fakerPassiveUses || 0) * (fighter.definition.passive.effects.cooldownReduction || 2.5));
            }
            return duration;
        }

        function ensureSkillCooldowns(fighter) {
            const skills = getSkills(fighter.definition);
            if (!Array.isArray(fighter.skillCooldowns) || fighter.skillCooldowns.length !== skills.length) {
                fighter.skillCooldowns = skills.map((skill, index) => {
                    if (index === 0 && Number.isFinite(fighter.skillCooldown)) {
                        return fighter.skillCooldown;
                    }
                    return skill.cooldown;
                });
            }
            if (skills.length > 0) {
                fighter.skillCooldown = fighter.skillCooldowns[0];
            }
            return fighter.skillCooldowns;
        }

        function rotateVector(x, y, radians) {
            return BattleCore.rotateVector(x, y, radians);
        }

        function setVelocityDirection(fighter, x, y, speed) {
            const direction = normalize(x, y);
            const scaled = scaledSpeed(speed);
            fighter.vx = direction.x * scaled;
            fighter.vy = direction.y * scaled;
        }

        function jitterVelocity(fighter, radians, speed = moveSpeedOf(fighter)) {
            if (speed <= 0) {
                fighter.vx = 0;
                fighter.vy = 0;
                return;
            }

            const rotated = rotateVector(fighter.vx || Math.random() - 0.5, fighter.vy || Math.random() - 0.5, radians);
            setVelocityDirection(fighter, rotated.x, rotated.y, speed);
        }

        function maintainMotion(fighter, now, jitterStrength = 0.18) {
            const speed = moveSpeedOf(fighter, now);
            if (speed <= 0) {
                if (fighter.forceMoveUntil <= now) {
                    fighter.vx = 0;
                    fighter.vy = 0;
                }
                return;
            }
            if (isStunned(fighter, now)) {
                return;
            }

            const desired = scaledSpeed(speed);
            const current = Math.hypot(fighter.vx, fighter.vy);
            if (!Number.isFinite(current) || current < desired * 0.18) {
                setVelocityDirection(fighter, Math.random() - 0.5, Math.random() - 0.5, speed);
                return;
            }

            if (!fighter.nextWobbleAt || now >= fighter.nextWobbleAt) {
                fighter.nextWobbleAt = now + 420 + Math.random() * 760;
                jitterVelocity(fighter, (Math.random() - 0.5) * jitterStrength, speed);
            } else {
                setVelocityDirection(fighter, fighter.vx, fighter.vy, speed);
            }
        }

        function clampToArena(value) {
            const radius = battle.ballSize / 2;
            return Math.max(radius, Math.min(battle.arenaSize - radius, value));
        }

        function dashWithFallback(fighter, preferredDirection, distance) {
            const startX = fighter.x;
            const startY = fighter.y;
            const base = normalize(preferredDirection.x, preferredDirection.y);
            const candidates = [
                base,
                rotateVector(base.x, base.y, Math.PI / 2),
                rotateVector(base.x, base.y, -Math.PI / 2),
                rotateVector(base.x, base.y, Math.PI / 4),
                rotateVector(base.x, base.y, -Math.PI / 4),
                normalize(battle.arenaSize / 2 - fighter.x, battle.arenaSize / 2 - fighter.y),
                normalize(Math.random() - 0.5, Math.random() - 0.5)
            ];
            let best = { x: startX, y: startY, moved: -1, direction: base };

            candidates.forEach((direction) => {
                const x = clampToArena(startX + direction.x * distance);
                const y = clampToArena(startY + direction.y * distance);
                const moved = Math.hypot(x - startX, y - startY);
                if (moved > best.moved) {
                    best = { x, y, moved, direction };
                }
            });

            fighter.x = best.x;
            fighter.y = best.y;
            if (best.moved > 1) {
                fighter.forceMoveUntil = performance.now() + 180;
                setVelocityDirection(fighter, best.direction.x, best.direction.y, Math.max(140, fighter.speed || 140));
            }
            return best.moved;
        }

        function layoutFighters() {
            const rect = arena.getBoundingClientRect();
            battle.arenaSize = rect.width;

                const party = battle.fighters.filter((item) => !item.isBoss && !item.isMapObject);
                const partyIndex = party.indexOf(fighter);
                const angle = -Math.PI / 2 + (Math.PI * 2 * Math.max(0, partyIndex)) / Math.max(1, party.length);
                fighter.x = fighter.isBoss ? center : center + Math.cos(angle) * radius;
                fighter.y = fighter.isBoss ? center : center + Math.sin(angle) * radius;
                const direction = normalize(center - fighter.x, center - fighter.y);
                fighter.vx = direction.x * scaledSpeed(moveSpeedOf(fighter)) * 1.45;
                fighter.vy = direction.y * scaledSpeed(moveSpeedOf(fighter)) * 1.45;

                fighter.element.classList.toggle("is-boss", fighter.isBoss);
                fighter.element.style.width = `${size}px`;

        }

        function parseHexColor(color) {
            if (!color || typeof color !== "string") {
                return { r: 120, g: 120, b: 120 };
            }
            const hex = color.trim();
            const short = hex.match(/^#([0-9a-fA-F]{3})$/);
            if (short) {
                return {
                    r: parseInt(short[1][0] + short[1][0], 16),
                    g: parseInt(short[1][1] + short[1][1], 16),
                    b: parseInt(short[1][2] + short[1][2], 16)
                };
            }
            const full = hex.match(/^#([0-9a-fA-F]{6})/);
            if (full) {
                return {
                    r: parseInt(full[1].slice(0, 2), 16),
                    g: parseInt(full[1].slice(2, 4), 16),
                    b: parseInt(full[1].slice(4, 6), 16)
                };
            }
            return { r: 120, g: 120, b: 120 };
        }

        function colorForHpRatio(baseColor, hpRatio) {
            const ratio = Math.max(0, Math.min(1, Number.isFinite(hpRatio) ? hpRatio : 1));
            const { r, g, b } = parseHexColor(baseColor);
            // 체력이 낮을수록 흰색에 가깝게 옅어짐
            const mix = 1 - ratio;
            const nr = Math.round(r + (245 - r) * mix);
            const ng = Math.round(g + (245 - g) * mix);
            const nb = Math.round(b + (245 - b) * mix);
            return `rgb(${nr}, ${ng}, ${nb})`;
        }

        function isRohOwlFighter(fighter) {

            if (fighter.hideFromHud === true) {
                return false;

            const def = fighter.definition || {};
            if (def.hideFromHud === true || isRohOwlFighter(fighter)) {

            if (fighter.isSummon && fighter.team === "boss") {

            battle.fighters.forEach((fighter) => {
