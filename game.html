<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>한남볼파이트 전투</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./characters.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@700&amp;family=Inter:wght@500&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#006d36",

                        "surface-container-highest": "#e5e2e1",
                        "on-primary-fixed-variant": "#005227",
                        "tertiary-container": "#aac4ff",
                        "surface-container-high": "#eae7e7",
                        "on-secondary-fixed": "#2c0051",
                        "surface-bright": "#fcf9f8",
                        "primary": "#006d36",
                        "secondary": "#8127cf",
                        "primary-fixed": "#6dfe9c",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "surface-variant": "#e5e2e1",
                        "secondary-fixed-dim": "#ddb7ff",
                        "on-primary-fixed": "#00210c",
                        "on-tertiary-fixed-variant": "#004395",
                        "tertiary-fixed": "#d8e2ff",
                        "inverse-primary": "#4de082",

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hard-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
        }

        .hard-shadow-sm {
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        }

        .brutal-border-thick {
            border: 4px solid #1c1b1b;
        }

        .brutal-border-thin {
            border: 2px solid #1c1b1b;
        }

        .btn-brutal {
            transition: all 0.1s ease;
        }

        .btn-brutal:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        }

        .fighter-ball {
            position: absolute;
            border-radius: 9999px;
            border: 4px solid #1c1b1b;
            box-shadow: 4px 4px 0px 0px #1c1b1b;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            user-select: none;
        }

        .fighter-ball.is-stunned::after {
            content: "!";
            position: absolute;
            inset: -4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.72);
            color: #ba1a1a;
            font: 800 42px "Plus Jakarta Sans", sans-serif;
        }

        .fighter-ball.is-dead {
            filter: grayscale(1);
            opacity: 0.35;
        }

        .fighter-ball.is-offmap {
            opacity: 0;
            transform: translate(-140px, -140px) !important;
        }

        .effect-ring,
        .effect-burst,
        .damage-float,
        .skill-label,
        .impact-star,
        .puddle-zone,
        .poison-field,
        .arena-flash {
            position: absolute;
            pointer-events: none;
            z-index: 20;
        }

        .effect-ring {
            border: 4px solid currentColor;
            border-radius: 9999px;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.65);
            animation: ring-pop 520ms ease-out forwards;
        }

        .effect-burst {
            width: 14px;
            height: 14px;
            background: currentColor;
            border: 2px solid #1c1b1b;
            box-shadow: 2px 2px 0px 0px #1c1b1b;
            animation: burst-pop 460ms ease-out forwards;
        }

        .damage-float {
            padding: 3px 6px;
            background: #ffffff;
            border: 2px solid #1c1b1b;
            box-shadow: 2px 2px 0px 0px #1c1b1b;
            font: 700 14px "JetBrains Mono", monospace;
            animation: damage-float 780ms ease-out forwards;
            white-space: nowrap;
        }

        .skill-label {
            padding: 4px 8px;
            background: #1c1b1b;
            color: #ffffff;
            border: 2px solid #ffffff;
            font: 700 13px "JetBrains Mono", monospace;
            animation: skill-label 720ms ease-out forwards;
            white-space: nowrap;
        }

        .impact-star {
            width: 24px;
            height: 24px;
            background: currentColor;
            border: 3px solid #1c1b1b;
            clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 69%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
            animation: impact-star 520ms ease-out forwards;
        }

        .puddle-zone {
            border-radius: 9999px;
            border: 2px solid rgba(28, 27, 27, 0.75);
            background: rgba(139, 47, 35, 0.38);
            z-index: 3;
        }

        .poison-field {
            inset: 0;
            background: rgba(139, 47, 35, 0.24);
            border: 6px solid rgba(139, 47, 35, 0.75);
            z-index: 4;
        }

        .arena-flash {
            inset: 0;
            background: currentColor;
            opacity: 0.16;
            z-index: 25;
            animation: arena-flash 220ms ease-out forwards;
        }

        @keyframes ring-pop {
            from {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(0.25);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        @keyframes burst-pop {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.8);
            }

            to {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(90deg) scale(1.2);
            }
        }

        @keyframes damage-float {
            from {
                opacity: 1;
                transform: translate(-50%, -50%);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -84px);
            }
        }

        @keyframes skill-label {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.9);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -86px) scale(1.06);
            }
        }

        @keyframes impact-star {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0deg) scale(0.4);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(160deg) scale(2);
            }
        }

        @keyframes puddle-pulse {
            from {
                transform: translate(-50%, -50%) scale(0.94);
                opacity: 0.78;
            }

            to {
                transform: translate(-50%, -50%) scale(1.04);
                opacity: 0.48;
            }
        }

        @keyframes poison-throb {
            0% {
                opacity: 0.72;
            }

            100% {
                opacity: 0.36;
            }
        }

        @keyframes arena-flash {
            from {
                opacity: 0.28;
            }

            to {
                opacity: 0;
            }
        }

        .modal-backdrop {
            background: rgba(28, 27, 27, 0.54);
        }

        .hud-card {
            min-width: 0;
        }

        .hud-name,
        .status-text,
        .hp-text {
            overflow-wrap: anywhere;
        }

        @media (max-width: 767px) {
            .hud-card {
                padding: 8px;
                background: #ffffff;
                border: 2px solid #1c1b1b;
                box-shadow: 2px 2px 0px 0px #1c1b1b;
            }

            .hud-name {
                font-size: 15px;
                line-height: 1.15;
            }

            .hp-text,
            .status-text {
                font-size: 11px;
                line-height: 1.15;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-base text-body-base min-h-screen flex flex-col pb-20 md:pb-0">
    <main class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 w-full max-w-6xl mx-auto">
        <div class="w-full max-w-[980px] flex items-center justify-between mb-4 gap-3">
            <a href="./index.html"
                class="px-3 py-2 bg-surface-container-lowest brutal-border-thin hard-shadow-sm btn-brutal font-label-numeric text-label-numeric flex items-center gap-1">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                선택
            </a>
            <div class="text-center">
                <h1 id="match-title"
                    class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md">
                    전투 준비
                </h1>
                <div id="elapsed-time" class="font-label-numeric text-label-numeric text-on-surface-variant mt-1">TIME
                    00:00.0</div>
            </div>
            <button id="restart-button"
                class="px-3 py-2 bg-primary text-on-primary brutal-border-thin hard-shadow-sm btn-brutal font-label-numeric text-label-numeric flex items-center gap-1">
                <span class="material-symbols-outlined text-[18px]">refresh</span>
                재시작
            </button>
        </div>

        <div class="w-full max-w-[980px] flex flex-col md:flex-row items-start justify-center gap-6 mb-8">
            <div id="arena"
                class="w-full max-w-[600px] aspect-square border-4 border-on-background bg-surface-container-lowest relative shadow-[8px_8px_0px_0px_#1c1b1b] overflow-hidden">
                <div id="countdown"
                    class="absolute inset-0 z-30 flex items-center justify-center bg-white/70 font-display-lg text-display-lg text-on-background text-center px-4">
                    3
                </div>
            </div>

            <div id="hud"
                class="w-full md:w-[320px] md:max-h-[600px] md:overflow-y-auto grid grid-cols-2 md:grid-cols-1 gap-3 md:gap-4 pb-2">
            </div>
        </div>
    </main>

    <div id="info-modal" class="fixed inset-0 hidden items-center justify-center p-4 modal-backdrop z-50">
        <div class="w-full max-w-md bg-surface brutal-border-thick hard-shadow p-6">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <h2 id="modal-name" class="font-headline-md text-headline-md"></h2>
                    <p id="modal-skill" class="font-label-numeric text-label-numeric text-secondary mt-1"></p>
                </div>
                <button id="modal-close"
                    class="w-9 h-9 bg-surface-container-lowest brutal-border-thin hard-shadow-sm btn-brutal flex items-center justify-center"
                    title="닫기">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>
            <div id="modal-body" class="space-y-3 text-body-base"></div>
        </div>
    </div>

    <script>
        const arena = document.getElementById("arena");
        const hud = document.getElementById("hud");
        const countdown = document.getElementById("countdown");
        const matchTitle = document.getElementById("match-title");
        const elapsedTime = document.getElementById("elapsed-time");
        const allCharacters = window.HannamBalls.getCharacters();
        const storedSelection = JSON.parse(localStorage.getItem("hannamBallsSelection") || "[]");
        let selectedCharacters = storedSelection
            .map((id) => window.HannamBalls.getCharacter(id))
            .filter(Boolean);

        if (selectedCharacters.length < 2) {
            selectedCharacters = allCharacters;
        }

        const battle = {
            fighters: [],
            arenaSize: 600,
            ballSize: 76,
            startedAt: 0,
            fightStartedAt: 0,
            finishedAt: 0,
            countdownSeconds: 3,
            isRunning: false,
            isFinished: false,
            lastTime: 0,
            pairHits: new Map(),
            activePuddles: [],
            activePoisons: []
        };
        const EFFECT_LIMITS = {
            bursts: 70,
            rings: 14,
            floatTexts: 18,
            stars: 12,
            flashes: 1
        };

        const activeEffects = {
            rings: 0,
            stars: 0,
            bursts: 0,
            floatTexts: 0,
            flashes: 0
        };

        let animationFrameId = null;
        let lastElapsedText = "";
        let cachedCorners = [];

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function normalize(x, y) {
            const length = Math.sqrt(x * x + y * y) || 1;
            return { x: x / length, y: y / length };
        }

        function arenaScale() {
            return Math.max(0.55, Math.min(1.05, battle.arenaSize / 600));
        }

        function scaledSpeed(speed) {
            return speed * arenaScale();
        }

        function formatElapsed(ms) {
            const totalSeconds = Math.max(0, ms) / 1000;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds - minutes * 60;
            return `${String(minutes).padStart(2, "0")}:${seconds.toFixed(1).padStart(4, "0")}`;
        }

        function currentFightElapsed(now) {
            if (!battle.fightStartedAt) {
                return 0;
            }

            return (battle.finishedAt || now) - battle.fightStartedAt;
        }

        function updateElapsed(now) {
            elapsedTime.textContent = `TIME ${formatElapsed(currentFightElapsed(now))}`;
        }

        function setVelocitySpeed(fighter, speed) {
            const direction = normalize(fighter.vx, fighter.vy);
            const scaled = scaledSpeed(speed);
            fighter.vx = direction.x * scaled;
            fighter.vy = direction.y * scaled;
        }

        function isStunned(fighter, now) {
            return fighter.stunnedUntil > now;
        }

        function avatarContent(definition) {
            if (definition.avatarSrc) {
                return `<img alt="${escapeHtml(definition.name)} 얼굴" class="w-full h-full object-cover" src="${escapeHtml(definition.avatarSrc)}">`;
            }

            return `<span class="font-headline-md text-headline-md">${escapeHtml(definition.avatarText)}</span>`;
        }

        function passiveHtml(definition) {
            if (!definition.passive) {
                return "";
            }

            return `
                <div class="bg-secondary-fixed brutal-border-thin p-2">
                    <p class="font-label-numeric text-label-numeric text-on-secondary-fixed">패시브: ${escapeHtml(definition.passive.name)}</p>
                    <p class="text-on-surface-variant mt-1">${escapeHtml(definition.passive.description)}</p>
                </div>
            `;
        }

        function createFighter(definition, index, total) {
            const element = document.createElement("div");
            element.className = "fighter-ball";
            element.style.background = definition.color;
            element.style.color = definition.textColor;
            element.style.borderColor = definition.color;
            element.innerHTML = avatarContent(definition);
            arena.appendChild(element);

            return {
                id: `${definition.id}-${index}`,
                definition,
                element,
                index,
                total,
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                hp: definition.maxHp,
                maxHp: definition.maxHp,
                attack: definition.baseAttack,
                speed: definition.speed,
                baseSpeed: definition.speed,
                statBonusAttack: 0,
                statBonusSpeedRatio: 0,
                statDamageReduction: 0,
                skillCooldown: definition.skill.cooldown,
                stunnedUntil: 0,
                savedVelocity: null,
                chargeUntil: 0,
                chargeHits: new Set(),
                invulnerableUntil: 0,
                offMapUntil: 0,
                nextPuddleAt: 0,
                nextDotFloatAt: 0,
                cornerIndex: index % 4,
                dead: false,
                hudElement: null
            };
        }

        function layoutFighters() {
            const rect = arena.getBoundingClientRect();
            battle.arenaSize = rect.width;
            battle.ballSize = Math.max(54, Math.min(82, battle.arenaSize * 0.14));
            updateCachedCorners();
            const center = battle.arenaSize / 2;
            const radius = Math.max(battle.ballSize, battle.arenaSize * 0.34);

            battle.fighters.forEach((fighter, index) => {
                const angle = -Math.PI / 2 + (Math.PI * 2 * index) / battle.fighters.length;
                fighter.x = center + Math.cos(angle) * radius;
                fighter.y = center + Math.sin(angle) * radius;
                const direction = normalize(center - fighter.x, center - fighter.y);
                fighter.vx = direction.x * scaledSpeed(fighter.speed) * 1.45;
                fighter.vy = direction.y * scaledSpeed(fighter.speed) * 1.45;
                fighter.element.style.width = `${battle.ballSize}px`;
                fighter.element.style.height = `${battle.ballSize}px`;
            });
        }

        function renderHud() {
            hud.innerHTML = battle.fighters.map((fighter) => `
                <div class="hud-card flex flex-col gap-1" data-hud-id="${fighter.id}">
                    <div class="flex items-center justify-between gap-2">
                        <span class="hud-name font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md tracking-tight"
                            style="color:${fighter.definition.color};">${escapeHtml(fighter.definition.name)}</span>
                        <button class="info-button w-6 h-6 flex items-center justify-center brutal-border-thin text-[10px] font-bold hover:bg-surface-container-high transition-colors"
                            data-info-id="${fighter.definition.id}" title="캐릭터 정보">i</button>
                    </div>
                    <div class="w-full h-6 md:h-8 border-2 border-on-background bg-surface-container-highest relative">
                        <div class="hp-fill absolute top-0 left-0 h-full bg-primary" style="width:100%;"></div>
                        <div class="hp-text absolute inset-0 flex items-center justify-center font-label-numeric text-label-numeric text-on-primary drop-shadow-[1px_1px_0px_rgba(0,0,0,0.8)]">
                            HP ${fighter.maxHp} / ${fighter.maxHp}
                        </div>
                    </div>
                    <div class="w-full h-3 bg-surface-container-highest border-2 border-on-background relative">
                        <div class="skill-fill h-full" style="width:0%; background:${fighter.definition.color};"></div>
                    </div>
                    <div class="status-text font-label-numeric text-label-numeric text-on-surface-variant">
                        CD ${escapeHtml(fighter.definition.skill.name)} ${fighter.definition.skill.cooldown.toFixed(1)} / ${fighter.definition.skill.cooldown.toFixed(1)}초
                    </div>
                    <div class="stat-bonus-text hidden font-label-numeric text-label-numeric text-primary">
                        ATK +0 / SPD +0%
                    </div>
                </div>
            `).join("");

            battle.fighters.forEach((fighter) => {
                const card = hud.querySelector(`[data-hud-id="${fighter.id}"]`);
                fighter.hudElement = card;
                fighter.hudHpFill = card.querySelector(".hp-fill");
                fighter.hudHpText = card.querySelector(".hp-text");
                fighter.hudSkillFill = card.querySelector(".skill-fill");
                fighter.hudStatus = card.querySelector(".status-text");
                fighter.hudStatBonus = card.querySelector(".stat-bonus-text");

                fighter.lastHpRatio = -1;
                fighter.lastHpText = "";
                fighter.lastSkillReady = -1;
                fighter.lastStatusText = "";
                fighter.lastStatBonusText = "";
                fighter.lastDead = false;
                fighter.lastIsStunned = false;
                fighter.lastIsOffmap = false;
            });

            hud.querySelectorAll(".info-button").forEach((button) => {
                button.addEventListener("click", () => {
                    const definition = allCharacters.find((character) => character.id === button.dataset.infoId);
                    showInfo(definition);
                });
            });
        }

        function updateHud(now) {
            battle.fighters.forEach((fighter) => {
                if (!fighter.hudElement) {
                    return;
                }

                const hpRatio = Math.max(0, fighter.hp / fighter.maxHp);
                const skillReady = Math.max(0, 1 - fighter.skillCooldown / fighter.definition.skill.cooldown);

                if (fighter.lastHpRatio !== hpRatio) {
                    fighter.hudHpFill.style.width = `${hpRatio * 100}%`;
                    fighter.lastHpRatio = hpRatio;
                }

                const hpTextVal = `HP ${Math.ceil(Math.max(0, fighter.hp))} / ${fighter.maxHp}`;
                if (fighter.lastHpText !== hpTextVal) {
                    fighter.hudHpText.textContent = hpTextVal;
                    fighter.lastHpText = hpTextVal;
                }

                if (fighter.lastSkillReady !== skillReady) {
                    fighter.hudSkillFill.style.width = `${skillReady * 100}%`;
                    fighter.lastSkillReady = skillReady;
                }

                let statusTextVal = "";
                let statusColor = "";
                if (fighter.dead) {
                    statusTextVal = "탈락";
                    statusColor = "#ba1a1a";
                } else if (isStunned(fighter, now)) {
                    statusTextVal = `행동 불가 ${(Math.max(0, fighter.stunnedUntil - now) / 1000).toFixed(1)}초`;
                    statusColor = "#ba1a1a";
                } else {
                    const cooldown = fighter.definition.skill.cooldown;
                    const remaining = Math.max(0, fighter.skillCooldown);
                    statusTextVal = remaining <= 0
                        ? `CD ${fighter.definition.skill.name} READY`
                        : `CD ${fighter.definition.skill.name} ${remaining.toFixed(1)} / ${cooldown.toFixed(1)}초`;
                }

                if (fighter.lastStatusText !== statusTextVal) {
                    fighter.hudStatus.textContent = statusTextVal;
                    fighter.hudStatus.style.color = statusColor;
                    fighter.lastStatusText = statusTextVal;
                }

                const hasBonus = fighter.statBonusAttack > 0 || fighter.statBonusSpeedRatio > 0 || fighter.statDamageReduction > 0;
                if (hasBonus) {
                    const bonusTextVal = `ATK +${Math.round(fighter.statBonusAttack)} / SPD +${Math.round(fighter.statBonusSpeedRatio * 100)}% / DMG -${Math.round(fighter.statDamageReduction * 100)}%`;
                    if (fighter.lastStatBonusText !== bonusTextVal) {
                        fighter.hudStatBonus.classList.remove("hidden");
                        fighter.hudStatBonus.textContent = bonusTextVal;
                        fighter.lastStatBonusText = bonusTextVal;
                    }
                } else {
                    if (fighter.lastStatBonusText !== "hidden") {
                        fighter.hudStatBonus.classList.add("hidden");
                        fighter.lastStatBonusText = "hidden";
                    }
                }
            });
        }

        function renderFighters(now) {
            battle.fighters.forEach((fighter) => {
                const stunState = !fighter.dead && isStunned(fighter, now);
                if (fighter.lastIsStunned !== stunState) {
                    fighter.element.classList.toggle("is-stunned", stunState);
                    fighter.lastIsStunned = stunState;
                }

                if (fighter.lastDead !== fighter.dead) {
                    fighter.element.classList.toggle("is-dead", fighter.dead);
                    fighter.lastDead = fighter.dead;
                }

                const offmapState = !fighter.dead && fighter.offMapUntil > now;
                if (fighter.lastIsOffmap !== offmapState) {
                    fighter.element.classList.toggle("is-offmap", offmapState);
                    fighter.lastIsOffmap = offmapState;
                }

                fighter.element.style.transform = `translate(${fighter.x - battle.ballSize / 2}px, ${fighter.y - battle.ballSize / 2}px)`;
            });
        }

        function effectRing(x, y, size, color) {
            if (activeEffects.rings >= EFFECT_LIMITS.rings) {
                return;
            }

            activeEffects.rings++;
            const ring = document.createElement("div");
            ring.className = "effect-ring";
            ring.style.left = `${x}px`;
            ring.style.top = `${y}px`;
            ring.style.width = `${size}px`;
            ring.style.height = `${size}px`;
            ring.style.color = color;
            arena.appendChild(ring);
            setTimeout(() => {
                ring.remove();
                activeEffects.rings--;
            }, 560);
        }

        function screenFlash(color) {
            if (activeEffects.flashes >= EFFECT_LIMITS.flashes) {
                return;
            }

            activeEffects.flashes++;
            const flash = document.createElement("div");
            flash.className = "arena-flash";
            flash.style.color = color;
            arena.appendChild(flash);
            setTimeout(() => {
                flash.remove();
                activeEffects.flashes--;
            }, 240);
        }

        function impactStar(x, y, color) {
            if (activeEffects.stars >= EFFECT_LIMITS.stars) {
                return;
            }

            activeEffects.stars++;
            const star = document.createElement("div");
            star.className = "impact-star";
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            star.style.color = color;
            arena.appendChild(star);
            setTimeout(() => {
                star.remove();
                activeEffects.stars--;
            }, 560);
        }

        function burst(x, y, color, count = 8) {
            const allowed = Math.max(0, Math.min(count, EFFECT_LIMITS.bursts - activeEffects.bursts, 8));

            for (let index = 0; index < allowed; index += 1) {
                activeEffects.bursts++;
                const shard = document.createElement("div");
                const angle = (Math.PI * 2 * index) / allowed;
                const distance = 28 + Math.random() * 28;
                shard.className = "effect-burst";
                shard.style.left = `${x}px`;
                shard.style.top = `${y}px`;
                shard.style.color = color;
                shard.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
                shard.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
                arena.appendChild(shard);
                setTimeout(() => {
                    shard.remove();
                    activeEffects.bursts--;
                }, 500);
            }
        }

        function megaBurst(x, y, color, count = 8) {
            burst(x, y, color, count);
            effectRing(x, y, battle.ballSize * 1.8, color);
            impactStar(x, y, color);
        }

        function floatText(text, x, y, color = "#ba1a1a") {
            if (activeEffects.floatTexts >= EFFECT_LIMITS.floatTexts) {
                return;
            }

            activeEffects.floatTexts++;
            const label = document.createElement("div");
            label.className = "damage-float";
            label.textContent = text;
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            label.style.color = color;
            arena.appendChild(label);
            setTimeout(() => {
                label.remove();
                activeEffects.floatTexts--;
            }, 820);
        }

        function skillLabel(text, fighter) {
            const label = document.createElement("div");
            label.className = "skill-label";
            label.textContent = text;
            label.style.left = `${fighter.x}px`;
            label.style.top = `${fighter.y - battle.ballSize / 2}px`;
            arena.appendChild(label);
            setTimeout(() => label.remove(), 760);
        }

        function reduceCooldown(fighter, seconds) {
            if (seconds > 0 && !fighter.dead && !isStunned(fighter, performance.now())) {
                fighter.skillCooldown = Math.max(0, fighter.skillCooldown - seconds);
            }
        }

        function healFighter(fighter, amount) {
            if (fighter.dead || amount <= 0 || fighter.hp >= fighter.maxHp) {
                return;
            }

            const healed = Math.min(amount, fighter.maxHp - fighter.hp);
            fighter.hp += healed;
            floatText(`+${Math.round(healed)}`, fighter.x, fighter.y - battle.ballSize / 2, "#006d36");
        }

        function applyDamage(target, amount, source, kind) {
            const now = performance.now();
            if (target.dead || amount <= 0) {
                return 0;
            }

            if (target.invulnerableUntil > now || target.offMapUntil > now) {
                floatText("MISS", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.1, target.definition.color);
                return 0;
            }

            if (kind === "basic" && target.definition.immuneToBasic) {
                floatText("IMMUNE", target.x, target.y - battle.ballSize / 2, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.2, target.definition.color);
                return 0;
            }

            const reducedAmount = amount * Math.max(0.4, 1 - (target.statDamageReduction || 0));
            const actual = Math.min(target.hp, reducedAmount);
            target.hp -= actual;
            const isDot = kind === "poison" || (kind === "basic" && source && source.definition.id === "lee-seunghyun");
            const canShowDot = !isDot || now >= target.nextDotFloatAt;

            if (canShowDot) {
                floatText(`-${Math.round(actual)}`, target.x, target.y - battle.ballSize / 2);
                if (isDot) {
                    target.nextDotFloatAt = now + 850;
                }
            }

            if (!isDot) {
                impactStar(target.x, target.y, source ? source.definition.color : "#ba1a1a");
            }

            if (kind === "skill") {
                effectRing(target.x, target.y, battle.ballSize * 1.35, source ? source.definition.color : "#ba1a1a");
            }

            if (!isStunned(target, now)) {
                reduceCooldown(target, target.definition.cooldownOnDamageTaken);
            }

            if (target.hp <= 0) {
                target.dead = true;
                target.vx = 0;
                target.vy = 0;
                target.element.style.zIndex = "1";
                burst(target.x, target.y, "#ba1a1a", 12);
                floatText("OUT", target.x, target.y, "#ba1a1a");
            }

            return actual;
        }

        function stun(target, seconds, now) {
            if (target.dead) {
                return;
            }

            if (!isStunned(target, now)) {
                target.savedVelocity = { vx: target.vx, vy: target.vy };
            }

            target.stunnedUntil = Math.max(target.stunnedUntil, now + seconds * 1000);
            target.vx = 0;
            target.vy = 0;
        }

        function restoreFromStun(fighter, now) {
            if (fighter.dead || fighter.stunnedUntil === 0 || isStunned(fighter, now)) {
                return;
            }

            if (fighter.savedVelocity) {
                fighter.vx = fighter.savedVelocity.vx;
                fighter.vy = fighter.savedVelocity.vy;
                setVelocitySpeed(fighter, fighter.speed);
            }

            fighter.savedVelocity = null;
            fighter.stunnedUntil = 0;
        }

        function updateCachedCorners() {
            const radius = battle.ballSize / 2;
            cachedCorners = [
                { x: radius, y: radius },
                { x: battle.arenaSize - radius, y: radius },
                { x: battle.arenaSize - radius, y: battle.arenaSize - radius },
                { x: radius, y: battle.arenaSize - radius }
            ];
        }

        function arenaCorners() {
            return cachedCorners;
        }

        function steerToCorner(fighter, dt, now) {
            const corners = arenaCorners();
            const target = corners[fighter.cornerIndex % corners.length];
            const dx = target.x - fighter.x;
            const dy = target.y - fighter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < battle.ballSize * 0.35) {
                fighter.cornerIndex = (fighter.cornerIndex + 1) % corners.length;
            }

            const nextTarget = corners[fighter.cornerIndex % corners.length];
            const direction = normalize(nextTarget.x - fighter.x, nextTarget.y - fighter.y);
            fighter.vx = direction.x * scaledSpeed(fighter.speed);
            fighter.vy = direction.y * scaledSpeed(fighter.speed);

            if (fighter.passiveDropEnabled !== false && now >= fighter.nextPuddleAt) {
                createPuddle(fighter, now);
                fighter.nextPuddleAt = now + fighter.definition.passive.effects.dropInterval * 1000;
            }
        }

        function createPuddle(fighter, now) {
            if (!fighter.definition.passive) {
                return;
            }

            const effects = fighter.definition.passive.effects;
            const ownPuddles = battle.activePuddles.filter((puddle) => puddle.source === fighter);
            if (ownPuddles.length >= effects.maxActivePuddles) {
                const oldest = ownPuddles[0];
                oldest.expiresAt = now;
                oldest.element.remove();
                battle.activePuddles = battle.activePuddles.filter((puddle) => puddle !== oldest);
            }

            const puddle = document.createElement("div");
            const radius = Math.max(28, Math.min(effects.puddleRadius, battle.arenaSize * (effects.puddleRadiusRatio || 0.105)));
            const size = radius * 2;
            puddle.className = "puddle-zone";
            puddle.style.left = `${fighter.x}px`;
            puddle.style.top = `${fighter.y}px`;
            puddle.style.width = `${size}px`;
            puddle.style.height = `${size}px`;
            arena.appendChild(puddle);

            battle.activePuddles.push({
                source: fighter,
                x: fighter.x,
                y: fighter.y,
                radius,
                damage: effects.puddleDamage,
                healRatio: effects.healRatio,
                tickInterval: effects.puddleTickInterval,
                nextTickAt: now + effects.puddleTickInterval * 1000,
                expiresAt: now + effects.puddleDuration * 1000,
                element: puddle
            });
        }

        function updatePuddles(now) {
            battle.activePuddles = battle.activePuddles.filter((puddle) => {
                if (now >= puddle.expiresAt || puddle.source.dead) {
                    puddle.element.remove();
                    return false;
                }

                if (now < puddle.nextTickAt) {
                    return true;
                }

                puddle.nextTickAt = now + puddle.tickInterval * 1000;
                battle.fighters.forEach((target) => {
                    if (target === puddle.source || target.dead || target.offMapUntil > now) {
                        return;
                    }

                    const dx = target.x - puddle.x;
                    const dy = target.y - puddle.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= puddle.radius + battle.ballSize * 0.35) {
                        const dealt = applyDamage(target, puddle.damage, puddle.source, "basic");
                        if (dealt > 0) {
                            reduceCooldown(puddle.source, puddle.source.definition.cooldownOnBasicHit);
                            healFighter(puddle.source, dealt * puddle.healRatio);
                        }
                    }
                });

                return true;
            });
        }

        function createPoisonField(source, now) {
            const effects = source.definition.skill.effects;
            const field = document.createElement("div");
            field.className = "poison-field";
            arena.appendChild(field);
            battle.activePoisons.push({
                source,
                damage: effects.poisonDps * effects.tickInterval,
                tickInterval: effects.tickInterval,
                nextTickAt: now + effects.tickInterval * 1000,
                expiresAt: now + effects.duration * 1000,
                element: field
            });
        }

        function updatePoisons(now) {
            battle.activePoisons = battle.activePoisons.filter((poison) => {
                if (now >= poison.expiresAt || poison.source.dead) {
                    poison.element.remove();
                    return false;
                }

                if (now < poison.nextTickAt) {
                    return true;
                }

                poison.nextTickAt = now + poison.tickInterval * 1000;
                battle.fighters.forEach((target) => {
                    if (target === poison.source || target.dead || target.offMapUntil > now) {
                        return;
                    }

                    applyDamage(target, poison.damage, poison.source, "poison");
                });

                return true;
            });
        }

        function restoreFromOffMap(fighter, now) {
            if (fighter.offMapUntil === 0 || fighter.offMapUntil > now) {
                return;
            }

            const corners = arenaCorners();
            const corner = corners[fighter.cornerIndex % corners.length];
            fighter.x = corner.x;
            fighter.y = corner.y;
            fighter.invulnerableUntil = 0;
            fighter.offMapUntil = 0;
            megaBurst(fighter.x, fighter.y, fighter.definition.color, 4);
        }

        function useSkill(fighter, now) {
            const id = fighter.definition.id;
            skillLabel(fighter.definition.skill.name, fighter);
            screenFlash(fighter.definition.color);
            megaBurst(fighter.x, fighter.y, fighter.definition.color, id === "lee-seunghyun" ? 4 : 8);

            if (id === "song-geonuk") {
                const effects = fighter.definition.skill.effects;
                const lost = Math.max(1, fighter.hp * effects.hpCostRatio);
                fighter.hp = Math.max(1, fighter.hp - lost);
                fighter.attack += effects.attackGain;
                fighter.statBonusAttack += effects.attackGain;
                fighter.speed *= effects.speedMultiplier;
                fighter.statBonusSpeedRatio = fighter.speed / fighter.baseSpeed - 1;
                fighter.statDamageReduction += effects.damageReductionGain || 0;
                setVelocitySpeed(fighter, fighter.speed);
                effectRing(fighter.x, fighter.y, battle.ballSize * 1.55, fighter.definition.color);
                burst(fighter.x, fighter.y, "#4ade80", 8);
                floatText(`ATK+${effects.attackGain} DEF+`, fighter.x, fighter.y, "#006d36");
            }

            if (id === "yoo-seungchan") {
                const effects = fighter.definition.skill.effects;
                const radius = Math.min(effects.radius, battle.arenaSize * 0.38);
                effectRing(fighter.x, fighter.y, radius * 2, fighter.definition.color);
                burst(fighter.x, fighter.y, fighter.definition.color, 10);
                battle.fighters.forEach((target) => {
                    if (target === fighter || target.dead) {
                        return;
                    }

                    const dx = target.x - fighter.x;
                    const dy = target.y - fighter.y;
                    if (Math.sqrt(dx * dx + dy * dy) <= radius) {
                        applyDamage(target, effects.damage, fighter, "skill");
                        stun(target, effects.stunSeconds, now);
                    }
                });
            }

            if (id === "han-yejun") {
                const effects = fighter.definition.skill.effects;
                effectRing(battle.arenaSize / 2, battle.arenaSize / 2, battle.arenaSize * 1.2, fighter.definition.color);
                burst(battle.arenaSize / 2, battle.arenaSize / 2, fighter.definition.color, 12);
                battle.fighters.forEach((target) => {
                    if (target !== fighter && !target.dead) {
                        applyDamage(target, effects.damage, fighter, "skill");
                        stun(target, effects.stunSeconds, now);
                    }
                });
            }

            if (id === "lee-woochan") {
                const effects = fighter.definition.skill.effects;
                fighter.chargeUntil = now + effects.durationMs;
                fighter.chargeHits = new Set();
                setVelocitySpeed(fighter, Math.max(effects.minSpeed, fighter.speed * effects.speedMultiplier));
                effectRing(fighter.x, fighter.y, battle.ballSize * 1.4, fighter.definition.color);
                burst(fighter.x, fighter.y, fighter.definition.color, 8);
            }

            if (id === "lee-seunghyun") {
                const effects = fighter.definition.skill.effects;
                fighter.offMapUntil = now + effects.offMapDuration * 1000;
                fighter.invulnerableUntil = fighter.offMapUntil;
                fighter.vx = 0;
                fighter.vy = 0;
                createPoisonField(fighter, now);
                effectRing(battle.arenaSize / 2, battle.arenaSize / 2, battle.arenaSize * 1.35, fighter.definition.color);
                burst(battle.arenaSize / 2, battle.arenaSize / 2, fighter.definition.color, 6);
                floatText("MAP OUT", fighter.x, fighter.y, fighter.definition.color);
            }

            fighter.skillCooldown = fighter.definition.skill.cooldown;
        }

        function handleWallBounce(fighter) {
            const radius = battle.ballSize / 2;
            let bounced = false;

            if (fighter.x < radius) {
                fighter.x = radius;
                fighter.vx = Math.abs(fighter.vx);
                bounced = true;
            } else if (fighter.x > battle.arenaSize - radius) {
                fighter.x = battle.arenaSize - radius;
                fighter.vx = -Math.abs(fighter.vx);
                bounced = true;
            }

            if (fighter.y < radius) {
                fighter.y = radius;
                fighter.vy = Math.abs(fighter.vy);
                bounced = true;
            } else if (fighter.y > battle.arenaSize - radius) {
                fighter.y = battle.arenaSize - radius;
                fighter.vy = -Math.abs(fighter.vy);
                bounced = true;
            }

            if (bounced) {
                effectRing(fighter.x, fighter.y, battle.ballSize * 0.8, fighter.definition.color);
            }
        }

        function handleBasicAttack(attacker, defender, now) {
            if (attacker.dead || defender.dead || isStunned(attacker, now) || attacker.definition.contactAttackDisabled) {
                return;
            }

            const dealt = applyDamage(defender, attacker.attack, attacker, "basic");
            if (dealt > 0) {
                reduceCooldown(attacker, attacker.definition.cooldownOnBasicHit);
            }
        }

        function handleChargeHit(charger, target, normalX, normalY) {
            const now = performance.now();
            if (charger.chargeUntil <= now || charger.chargeHits.has(target.id) || charger.dead || target.dead) {
                return;
            }

            charger.chargeHits.add(target.id);
            const effects = charger.definition.skill.effects;
            applyDamage(target, effects.damage, charger, "skill");
            if (target.definition.immuneToKnockback) {
                floatText("NO PUSH", target.x, target.y, target.definition.color);
                effectRing(target.x, target.y, battle.ballSize * 1.15, target.definition.color);
            } else if (!isStunned(target, now)) {
                target.vx = normalX * scaledSpeed(effects.knockback);
                target.vy = normalY * scaledSpeed(effects.knockback);
            }
            burst(target.x, target.y, charger.definition.color, 16);
            effectRing(target.x, target.y, battle.ballSize * 1.3, charger.definition.color);
        }

        function handleCollisions(now) {
            const radius = battle.ballSize / 2;

            for (let first = 0; first < battle.fighters.length; first += 1) {
                for (let second = first + 1; second < battle.fighters.length; second += 1) {
                    const a = battle.fighters[first];
                    const b = battle.fighters[second];
                    if (a.dead || b.dead || a.offMapUntil > now || b.offMapUntil > now) {
                        continue;
                    }

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                    const minDistance = radius * 2;

                    if (distance > minDistance) {
                        continue;
                    }

                    const nx = dx / distance;
                    const ny = dy / distance;
                    const overlap = minDistance - distance;
                    const noPushPair = a.definition.noPushCollision || b.definition.noPushCollision;

                    if (!noPushPair && !isStunned(a, now)) {
                        a.x -= nx * overlap * 0.5;
                        a.y -= ny * overlap * 0.5;
                    }
                    if (!noPushPair && !isStunned(b, now)) {
                        b.x += nx * overlap * 0.5;
                        b.y += ny * overlap * 0.5;
                    }

                    const aVelocity = a.vx * nx + a.vy * ny;
                    const bVelocity = b.vx * nx + b.vy * ny;
                    const impulse = bVelocity - aVelocity;

                    if (!noPushPair && !isStunned(a, now)) {
                        a.vx += impulse * nx;
                        a.vy += impulse * ny;
                    }
                    if (!noPushPair && !isStunned(b, now)) {
                        b.vx -= impulse * nx;
                        b.vy -= impulse * ny;
                    }

                    if (!noPushPair) {
                        const aCharge = a.definition.skill.effects || {};
                        const bCharge = b.definition.skill.effects || {};
                        setVelocitySpeed(a, a.chargeUntil > now ? Math.max(aCharge.minSpeed, a.speed * aCharge.speedMultiplier) : a.speed);
                        setVelocitySpeed(b, b.chargeUntil > now ? Math.max(bCharge.minSpeed, b.speed * bCharge.speedMultiplier) : b.speed);
                        effectRing((a.x + b.x) / 2, (a.y + b.y) / 2, battle.ballSize * 1.15, "#1c1b1b");
                        if (now - (battle.lastImpactAt || 0) > 90) {
                            battle.lastImpactAt = now;
                            impactStar((a.x + b.x) / 2, (a.y + b.y) / 2, "#facc15");
                        }
                    }

                    handleChargeHit(a, b, nx, ny);
                    handleChargeHit(b, a, -nx, -ny);

                    const key = `${a.id}:${b.id}`;
                    const lastHit = battle.pairHits.get(key) || 0;
                    if (now - lastHit > 620) {
                        battle.pairHits.set(key, now);
                        handleBasicAttack(a, b, now);
                        handleBasicAttack(b, a, now);
                        burst((a.x + b.x) / 2, (a.y + b.y) / 2, "#1c1b1b", 5);
                    }
                }
            }
        }

        function updatePhysics(dt, now) {
            battle.fighters.forEach((fighter) => {
                if (fighter.dead) {
                    return;
                }

                restoreFromOffMap(fighter, now);

                if (fighter.offMapUntil > now) {
                    return;
                }

                restoreFromStun(fighter, now);

                if (isStunned(fighter, now)) {
                    return;
                }

                fighter.skillCooldown -= dt;
                if (fighter.skillCooldown <= 0) {
                    useSkill(fighter, now);
                }

                if (fighter.chargeUntil > now) {
                    if (Math.random() < 0.08) {
                        burst(fighter.x, fighter.y, fighter.definition.color, 2);
                    }
                } else if (fighter.definition.movementPattern === "corners") {
                    steerToCorner(fighter, dt, now);
                } else {
                    setVelocitySpeed(fighter, fighter.speed);
                }

                fighter.x += fighter.vx * dt;
                fighter.y += fighter.vy * dt;
                handleWallBounce(fighter);
            });

            handleCollisions(now);
            updatePuddles(now);
            updatePoisons(now);
        }

        function checkWinner(now) {
            const alive = battle.fighters.filter((fighter) => !fighter.dead);
            if (!battle.isFinished && battle.isRunning && alive.length <= 1) {
                battle.isFinished = true;
                battle.isRunning = false;
                battle.finishedAt = now;
                countdown.classList.remove("hidden");
                countdown.innerHTML = `
                    <div>
                        <div>${alive[0] ? `${escapeHtml(alive[0].definition.name)} 승리` : "무승부"}</div>
                        <div class="font-label-numeric text-label-numeric mt-3">TIME ${formatElapsed(currentFightElapsed(now))}</div>
                    </div>
                `;
                matchTitle.textContent = "전투 종료";
                updateElapsed(now);
            }
        }

        function tick(now) {
            if (!battle.lastTime) {
                battle.lastTime = now;
            }

            const elapsed = now - battle.startedAt;
            const remaining = Math.ceil((battle.countdownSeconds * 1000 - elapsed) / 1000);

            if (!battle.isRunning && !battle.isFinished) {
                const countdownText = remaining > 0 ? String(remaining) : "FIGHT";
                if (countdown.textContent !== countdownText) {
                    countdown.textContent = countdownText;
                }
                if (elapsed >= battle.countdownSeconds * 1000) {
                    battle.isRunning = true;
                    battle.fightStartedAt = now;
                    countdown.classList.add("hidden");
                    matchTitle.textContent = "전투 중";
                }
            }

            const dt = Math.min(0.033, (now - battle.lastTime) / 1000);
            battle.lastTime = now;

            if (battle.isRunning) {
                updatePhysics(dt, now);
                checkWinner(now);
            }

            renderFighters(now);
            updateHud(now);
            updateElapsed(now);

            if (battle.isRunning || !battle.isFinished) {
                animationFrameId = requestAnimationFrame(tick);
            } else {
                animationFrameId = null;
            }
        }

        function showInfo(definition) {
            document.getElementById("modal-name").textContent = definition.name;
            document.getElementById("modal-name").style.color = definition.color;
            document.getElementById("modal-skill").textContent = `${definition.skill.name} / ${definition.skill.cooldown}초`;
            document.getElementById("modal-body").innerHTML = `
                <div class="grid grid-cols-2 gap-2 font-label-numeric text-label-numeric">
                    <div class="bg-surface-container-low brutal-border-thin p-2">HP ${definition.maxHp}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">ATK ${definition.baseAttack}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">SPD ${escapeHtml(definition.speedLabel)}</div>
                    <div class="bg-surface-container-low brutal-border-thin p-2">${escapeHtml(definition.colorName)}</div>
                </div>
                ${passiveHtml(definition)}
                <p class="text-on-surface-variant">${escapeHtml(definition.skill.description)}</p>
                <p class="font-label-numeric text-label-numeric">특성: ${escapeHtml(definition.traits.join(" / "))}</p>
                ${definition.immuneToBasic ? '<p class="font-label-numeric text-label-numeric text-secondary">기본 공격 피해 면역</p>' : ''}
                ${definition.immuneToKnockback ? '<p class="font-label-numeric text-label-numeric text-secondary">밀치기 면역</p>' : ''}
            `;
            document.getElementById("info-modal").classList.remove("hidden");
            document.getElementById("info-modal").classList.add("flex");
        }

        function hideInfo() {
            document.getElementById("info-modal").classList.add("hidden");
            document.getElementById("info-modal").classList.remove("flex");
        }

        function startBattle() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            arena.querySelectorAll(".fighter-ball, .effect-ring, .effect-burst, .damage-float, .skill-label, .impact-star, .puddle-zone, .poison-field, .arena-flash").forEach((node) => node.remove());
            battle.fighters = selectedCharacters.map((definition, index) => createFighter(definition, index, selectedCharacters.length));
            battle.pairHits = new Map();
            battle.activePuddles = [];
            battle.activePoisons = [];

            activeEffects.rings = 0;
            activeEffects.stars = 0;
            activeEffects.bursts = 0;
            activeEffects.floatTexts = 0;
            activeEffects.flashes = 0;

            battle.startedAt = performance.now();
            battle.fightStartedAt = 0;
            battle.finishedAt = 0;
            battle.lastTime = 0;
            battle.isRunning = false;
            battle.isFinished = false;
            countdown.classList.remove("hidden");
            countdown.textContent = "3";
            matchTitle.textContent = "전투 준비";

            lastElapsedText = "";
            elapsedTime.textContent = "TIME 00:00.0";

            layoutFighters();
            renderHud();
            renderFighters(performance.now());

            animationFrameId = requestAnimationFrame(tick);
        }

        document.getElementById("restart-button").addEventListener("click", startBattle);
        document.getElementById("modal-close").addEventListener("click", hideInfo);
        document.getElementById("info-modal").addEventListener("click", (event) => {
            if (event.target.id === "info-modal") {
                hideInfo();
            }
        });
        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                hideInfo();
            }
        });

        window.addEventListener("resize", () => {
            if (!battle.fighters.length) {
                return;
            }
            const oldSize = battle.arenaSize || 1;
            const rect = arena.getBoundingClientRect();
            const ratio = rect.width / oldSize;
            battle.arenaSize = rect.width;
            battle.ballSize = Math.max(54, Math.min(82, battle.arenaSize * 0.14));
            updateCachedCorners();
            battle.fighters.forEach((fighter) => {
                fighter.x *= ratio;
                fighter.y *= ratio;
                fighter.element.style.width = `${battle.ballSize}px`;
                fighter.element.style.height = `${battle.ballSize}px`;
            });
        });

        startBattle();
    </script>
</body>

</html>
