[package]
name = "hannam-balls"
version = "0.1.0"
description = "Hannam Balls game in Tauri"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "hannam_balls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
